<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderno da Roça</title>
<meta name="description" content="Caderno de campo do produtor rural: chuva, leite, queijo, criações, serviços, gastos, vendas, relatórios e guias para o semiárido.">
<meta name="theme-color" content="#1a1311">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderno da Roça">
<style>
/* Layout: cabeçalho escuro fixo, conteúdo em coluna única (máx. 640px), barra de abas fixa embaixo com botões grandes para o polegar */
:root{
  --bg:#f7f5f2; --surface:#ffffff; --surface-2:#f0ece7; --line:#e2dcd5;
  --fg:#1d1715; --muted:#6c615b;
  --red:#b3201b; --red-ink:#ffffff; --red-soft:#f8e3e1;
  --gold:#c98d10; --gold-soft:#fbefd2; --gold-ink:#5b3e00;
  --black:#1a1311;
  --good:#2f7d32; --good-soft:#e2f1e2; --warn:#b26a00; --warn-soft:#fdf0d9; --bad:#b3261e;
  --rain:#2f6fb0; --rain-soft:#e1ecf8;
  --font: "Segoe UI", Roboto, "Noto Sans", system-ui, -apple-system, sans-serif;
  --font-display: "Segoe UI Black", "Arial Black", Roboto, system-ui, sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120f0e; --surface:#1d1816; --surface-2:#272120; --line:#352d2a;
    --fg:#f3ece8; --muted:#a8998f;
    --red:#e0473f; --red-ink:#ffffff; --red-soft:#3a1716;
    --gold:#e9b23c; --gold-soft:#3a2c0e; --gold-ink:#f6d896;
    --black:#0b0908;
    --good:#6cc070; --good-soft:#1c3220; --warn:#f0a940; --warn-soft:#3a2a10; --bad:#ff7a70;
    --rain:#7fb4ec; --rain-soft:#15283c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120f0e; --surface:#1d1816; --surface-2:#272120; --line:#352d2a;
  --fg:#f3ece8; --muted:#a8998f;
  --red:#e0473f; --red-ink:#ffffff; --red-soft:#3a1716;
  --gold:#e9b23c; --gold-soft:#3a2c0e; --gold-ink:#f6d896;
  --black:#0b0908;
  --good:#6cc070; --good-soft:#1c3220; --warn:#f0a940; --warn-soft:#3a2a10; --bad:#ff7a70;
  --rain:#7fb4ec; --rain-soft:#15283c;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
.h1{font-size:26px;font-family:var(--font-display)}

/* Cabeçalho */
.top{position:sticky;top:0;z-index:20;background:var(--black);color:#fff;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--font-display);font-size:20px;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;font-size:13px;color:#d9c9a3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-stripe{height:4px;background:linear-gradient(90deg,var(--red) 0 70%,#e9b23c 70% 100%)}

main{max-width:640px;margin:0 auto;padding-block:16px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}

/* Abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted);cursor:pointer;min-height:64px}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--red);font-weight:700}
.tab.plus .bubble{width:46px;height:46px;border-radius:50%;background:var(--red);color:var(--red-ink);display:grid;place-items:center;margin-top:-20px;box-shadow:0 4px 12px rgba(0,0,0,.25);border:3px solid var(--surface)}
.tab.plus .bubble svg{width:28px;height:28px}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,.tile:focus-visible,.row:focus-visible,.link:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Blocos */
.section{display:flex;flex-direction:column;gap:10px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.section-h h2{font-size:19px;font-weight:800}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.link{align-self:flex-start;background:none;border:0;color:var(--red);font-weight:700;cursor:pointer;padding:6px 0;font-size:15px}

.banner{background:var(--gold-soft);color:var(--gold-ink);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.banner .btn{align-self:flex-start}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h1{font-size:24px;font-family:var(--font-display);text-transform:capitalize}
.iconbtn{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn:disabled{opacity:.35}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .v small{font-size:15px;font-weight:600;color:var(--muted)}
.stat .s{font-size:13px;color:var(--muted)}
.stat.rain .v{color:var(--rain)}
.stat.money.pos .v{color:var(--good)}
.stat.money.neg .v{color:var(--bad)}

/* Barras de resultado */
.bars{display:flex;flex-direction:column;gap:4px}
.bar-row{display:grid;grid-template-columns:104px 1fr;gap:4px 10px;align-items:center;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;border-radius:8px}
.bar-row .lbl{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{position:relative;height:30px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.bar-fill{position:absolute;top:0;bottom:0;border-radius:8px}
.bar-val{position:absolute;inset:0;display:flex;align-items:center;padding:0 10px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.bar-sub{grid-column:2;font-size:13px;color:var(--muted)}

.chart{width:100%;height:auto;display:block}

/* Listas */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;cursor:pointer}
.row:last-child{border-bottom:0}
.row .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.row .ic svg{width:22px;height:22px}
.row .tx{flex:1;min-width:0}
.row .tx > b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx > span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px}
.row .tx .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.amt.pos{color:var(--good)} .amt.neg{color:var(--bad)} .amt.rain{color:var(--rain)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:15px;margin:0}

.ic-chuva{background:var(--rain-soft);color:var(--rain)}
.ic-leite,.ic-producao{background:var(--surface-2);color:var(--fg)}
.ic-gasto{background:var(--red-soft);color:var(--red)}
.ic-venda{background:var(--good-soft);color:var(--good)}
.ic-plantio,.ic-colheita{background:var(--gold-soft);color:var(--gold-ink)}
.ic-anotacao{background:var(--surface-2);color:var(--muted)}
.ic-cria{background:var(--surface-2);color:var(--fg)}
.ic-cria2{background:var(--red-soft);color:var(--red)}
.ic-cria3{background:var(--gold-soft);color:var(--gold-ink)}

/* Alertas */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-left-width:5px}
.alert.warn{border-left-color:var(--warn)}
.alert.info{border-left-color:var(--rain)}
.alert.red{border-left-color:var(--red)}
.alert .when{font-size:13px;color:var(--muted);display:block}
.alert .tx{flex:1;min-width:0}
.alert b{display:block}

/* Grade de lançamentos */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-height:98px;min-width:0}
.tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.tile .ic svg{width:24px;height:24px}
.tile b{font-size:17px}
.tile span{font-size:13px;color:var(--muted);margin-top:-6px}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--black);color:#fff;border-color:var(--black)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--gold);color:#1a1311;border-color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--gold);color:#1a1311;border-color:var(--gold)}}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.gray{background:var(--surface-2);color:var(--muted)}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-size:16px;text-align:center}
.btn.primary{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.btn.gold{background:var(--gold);color:#1a1311;border-color:var(--gold)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-grid .btn{padding:0 10px}

/* Formulário */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:700;font-size:15px}
.field .hint{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{min-height:52px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 14px;font-size:18px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline > *{min-width:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{border:0;background:none;border-radius:9px;min-height:44px;font-weight:700;cursor:pointer;font-size:15px;padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15);color:var(--red)}
.total-live{background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.total-live b{font-size:24px;font-variant-numeric:tabular-nums}
.erro{color:var(--bad);margin:0;font-size:14px}

/* Folha (modal) */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(10,6,5,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;
  padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-h h2{font-size:21px;font-weight:800}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:20px}}

/* Guias */
.article{display:flex;flex-direction:column;gap:12px;font-size:17px}
.article h3{font-size:18px;margin-top:6px}
.article p{margin:0}
.article ul,.article ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.tip{background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:12px 14px;font-size:15px}
.caution{background:var(--red-soft);color:var(--fg);border-radius:12px;padding:12px 14px;font-size:15px;border-left:4px solid var(--red)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--surface)}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.pos{color:var(--good);font-weight:700} td.neg{color:var(--bad);font-weight:700}
tfoot td{font-weight:800;background:var(--surface-2)}

.result{background:var(--surface);border:2px solid var(--gold);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.result .big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}

/* Relatório */
.rel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:18px}
.rel-h{border-bottom:3px solid var(--red);padding-bottom:12px;display:flex;flex-direction:column;gap:4px}
.rel-h h1{font-family:var(--font-display);font-size:24px}
.rel table,.sheet .table-wrap table{font-size:14px}
.rel th,.rel td,.sheet .table-wrap th,.sheet .table-wrap td{padding:8px 8px;white-space:normal}
.rel td.n,.rel th.n,.sheet .table-wrap td.n,.sheet .table-wrap th.n{white-space:nowrap}
.rel th,.sheet .table-wrap th{font-size:11px}
.rel h2{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--red)}
.rel .sec{display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;min-width:0}
.kv span{font-size:12px;color:var(--muted);font-weight:600}
.kv b{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rel ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* Produções */
.prods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.prod-card .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.prod-card .ic svg{width:26px;height:26px}
.prod-card b{font-size:17px;line-height:1.2}
.prod-card .sob{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.prod-card .sob.pos{color:var(--good)} .prod-card .sob.neg{color:var(--bad)} .prod-card .sob.nada{color:var(--muted);font-weight:600;font-size:14px}
.prod-card.add{border-style:dashed;justify-content:center;align-items:center;text-align:center;color:var(--muted);min-height:120px}
.prod-h{display:flex;align-items:center;gap:12px}
.prod-h .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none}
.prod-h .ic svg{width:30px;height:30px}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acao{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:100px;padding:12px 8px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:17px;cursor:pointer;text-align:center}
.acao .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.acao .ic svg{width:24px;height:24px}
.acao.principal{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.acao.principal .ic{background:rgba(255,255,255,.18);color:#fff}
.acao:focus-visible,.prod-card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fixo{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}
.fixo .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.fixo .ic svg{width:20px;height:20px}
.fixo b{flex:1}
.ouvir{gap:6px}
.ouvir svg{width:20px;height:20px}
.topbtn{margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;color:#fff;cursor:pointer;font-size:11px;padding:6px 4px;min-width:48px}
.topbtn svg{width:24px;height:24px}
.topbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--black);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.3);max-width:calc(100% - 32px)}

@media (max-width:420px){
  .kv b{font-size:14px}
  .kv div{padding:8px}
}
@media (max-width:380px){
  .stat .v{font-size:22px}
  .bar-row{grid-template-columns:84px 1fr}
  .kv{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
}
@media print{
  .top,.tabs,.noprint,.banner,.toast,#sheetWrap{display:none!important}
  body{padding:0;background:#fff;color:#000;font-size:12pt}
  main{max-width:none;padding:0}
  .rel{border:0;padding:0}
  .kv div,th,tfoot td{background:#f2f2f2!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

    if (!x.ativ) x.ativ = x.tipo || 'leite';

    if (!x.movs) x.movs = [];
    return x;
  });

  return d;
}

  try { const raw = localStorage.getItem(KEY); if (raw) return migrar(JSON.parse(raw)); } catch(e){}

/* ---------- cálculos ---------- */
const doPer = p => S.registros.filter(r => r.data.startsWith(p));
function resumo(p){
  const rs = doPer(p);
  const chuva = rs.filter(r=>r.tipo==='chuva').reduce((s,r)=>s+(r.mm||0),0);
  const diasChuva = new Set(rs.filter(r=>r.tipo==='chuva' && r.mm>0).map(r=>r.data)).size;
  const leiteRs = rs.filter(r=>r.tipo==='leite');
  const leite = leiteRs.filter(r=>(r.ativ||'leite')==='leite').reduce((s,r)=>s+(r.litros||0),0);
  const leiteCabra = leiteRs.filter(r=>r.ativ==='caprinos').reduce((s,r)=>s+(r.litros||0),0);
  const diasLeite = new Set(leiteRs.filter(r=>(r.ativ||'leite')==='leite').map(r=>r.data)).size;
  const porAtiv = {};
  rs.forEach(r => {
    if (r.tipo!=='venda' && r.tipo!=='gasto') return;
    const k = r.ativ || 'geral';
    porAtiv[k] ||= {ent:0, sai:0, n:0};
    porAtiv[k][r.tipo==='venda'?'ent':'sai'] += r.valor||0; porAtiv[k].n++;
  });
  const ent = Object.values(porAtiv).reduce((s,a)=>s+a.ent,0);
  const sai = Object.values(porAtiv).reduce((s,a)=>s+a.sai,0);
  return {rs, chuva, diasChuva, leite, leiteCabra, diasLeite, porAtiv, ent, sai, saldo: ent-sai};
}
function custoLitro(p){
  const r = resumo(p);
  const gasto = (r.porAtiv.leite||{sai:0}).sai;
  const vend = r.rs.filter(x=>x.tipo==='venda' && x.ativ==='leite' && x.unidade==='litros' && x.qtd);
  const litrosVend = vend.reduce((s,x)=>s+x.qtd,0), valVend = vend.reduce((s,x)=>s+(x.valor||0),0);
  return { custo: r.leite && gasto ? gasto / r.leite : null, preco: litrosVend ? valVend / litrosVend : null, litros: r.leite };
}
function producoes(rs){
  // agrupa produção por produto e unidade
  const g = {};
  rs.filter(r=>r.tipo==='producao').forEach(r => {
    const k = r.produto + '|' + r.unidade;
    g[k] ||= {produto:r.produto, unidade:r.unidade, qtd:0, litros:0, qtdComLeite:0};
    g[k].qtd += r.qtd||0;
    if (r.litrosUsados) { g[k].litros += r.litrosUsados; g[k].qtdComLeite += r.qtd||0; }
  });
  return Object.values(g).sort((a,b)=>b.qtd-a.qtd);
}
function vendasPorUnidade(rs){
  const g = {};
  rs.filter(r=>r.tipo==='venda' && r.qtd).forEach(r => {
    const k = (r.desc||'Venda') + '|' + r.unidade;
    g[k] ||= {desc:r.desc||'Venda', unidade:r.unidade, qtd:0, valor:0, n:0};
    g[k].qtd += r.qtd; g[k].valor += r.valor||0; g[k].n++;
  });
  return Object.values(g).sort((a,b)=>b.valor-a.valor);
}
function gastosPorItem(rs){
  const g = {};
  rs.filter(r=>r.tipo==='gasto').forEach(r => { const k = r.desc||'Sem descrição'; g[k] ||= {desc:k, valor:0}; g[k].valor += r.valor||0; });
  return Object.values(g).sort((a,b)=>b.valor-a.valor);
}

/* ---------- reprodução e alertas ---------- */
const temRepro = a => a.modo==='animal' && a.sexo==='F' && CRIA[a.ativ] && CRIA[a.ativ].gest;
function situacao(a){
  const c = CRIA[a.ativ] || {}, out = {};
  if (!temRepro(a)) return out;
  if (a.cobertura && (!a.ultParto || a.cobertura > a.ultParto)) {
    out.prenha = true;
    out.parto = addDias(a.cobertura, c.gest);
    if (c.secar) out.secar = addDias(out.parto, -c.secar);
  }
  if (!out.prenha && a.ultCio) {
    let p = addDias(a.ultCio, c.cio);
    while (diffDias(hoje(), p) < -3) p = addDias(p, c.cio);
    out.proxCio = p;
  }
  if (a.ultParto) out.diasParida = diffDias(a.ultParto, hoje());
  return out;
}
function alertas(){
  const h = hoje(), lista = [];
  S.animais.forEach(a => {
    if (!temRepro(a)) return;
    const s = situacao(a);
    if (s.prenha) {
      const dp = diffDias(h, s.parto);
      if (dp >= -5 && dp <= 30) lista.push({data:s.parto, nivel:'red', t:`Parto previsto: ${a.nome}`, d:`${fData(s.parto)} · ${quando(s.parto)}`, id:a.id});
      else if (s.secar) { const ds = diffDias(h, s.secar); if (ds >= -10 && ds <= 15) lista.push({data:s.secar, nivel:'warn', t:`Secar ${a.nome}`, d:`${fData(s.secar)} · ${quando(s.secar)} · 60 dias antes do parto`, id:a.id}); }
    }
    if (s.proxCio) { const dc = diffDias(h, s.proxCio); if (dc >= -2 && dc <= 5) lista.push({data:s.proxCio, nivel:'info', t:`Observar cio: ${a.nome}`, d:`${fData(s.proxCio)} · ${quando(s.proxCio)}`, id:a.id}); }
    if (a.ativ==='leite' && !s.prenha && s.diasParida != null && s.diasParida > 90) lista.push({data:h, nivel:'warn', t:`${a.nome} vazia há ${s.diasParida} dias após o parto`, d:'Converse com o veterinário sobre a reprodução', id:a.id});
  });
  S.lembretes.filter(l => !l.feito).forEach(l => {
    const d = diffDias(h, l.data);
    if (d <= 15) lista.push({data:l.data, nivel: d < 0 ? 'red' : 'info', t:l.texto, d:`${fData(l.data)} · ${quando(l.data)}`, lembrete:l.id});
  });
  return lista.sort((a,b)=>a.data<b.data?-1:1);
}

  Object.keys(r.porAtiv).forEach(k => { if (!ks.includes(k)) ks.push(k); });

function falaR(n){
  const a = Math.abs(n||0), reais = Math.floor(a + 1e-9), cent = Math.round((a - reais) * 100);
  if (!reais && !cent) return 'zero real';
  return `${n<0?'menos ':''}${reais ? `${reais.toLocaleString('pt-BR')} ${reais===1?'real':'reais'}` : ''}${reais&&cent?' e ':''}${cent ? `${cent} ${cent===1?'centavo':'centavos'}` : ''}`;
}
function marcarBotao(btn, ativo){
  if (!btn || !btn.isConnected) return;
  if (ativo) { btn.dataset.orig = btn.innerHTML; btn.innerHTML = `${ICONS.parar} Parar`; }
  else if (btn.dataset.orig) { btn.innerHTML = btn.dataset.orig; delete btn.dataset.orig; }
}
function pararFala(){ try { if (podeFalar() && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel(); } catch(e){} marcarBotao(botaoFalando, false); botaoFalando = null; }
function falar(txt, btn){
  if (!podeFalar()) return;
  const mesmo = botaoFalando === btn;
  pararFala();
  if (mesmo) return;
  const u = new SpeechSynthesisUtterance(txt.replace(/R\$\s?/g,'').replace(/\s+/g,' '));
  u.lang = 'pt-BR'; u.rate = 0.95;
  const vs = speechSynthesis.getVoices();
  const voz = vs.find(v=>/^pt[-_]BR/i.test(v.lang)) || vs.find(v=>/^pt/i.test(v.lang));
  if (voz) u.voice = voz;
  u.onend = u.onerror = () => { if (botaoFalando === btn) { marcarBotao(btn, false); botaoFalando = null; } };
  botaoFalando = btn; marcarBotao(btn, true);
  speechSynthesis.speak(u);
}
function textoInicio(){
  const m = ui.mes, r = resumo(m), mesN = MESES[Number(m.slice(5,7))-1];
  const L = [r.saldo>=0 ? `Em ${mesN}, sobrou ${falaR(r.saldo)}.` : `Em ${mesN}, você gastou mais do que recebeu. Faltou ${falaR(-r.saldo)}.`, `Recebeu ${falaR(r.ent)} e gastou ${falaR(r.sai)}.`];
  Object.entries(r.porAtiv).sort((a,b)=>(b[1].ent-b[1].sai)-(a[1].ent-a[1].sai)).forEach(([k,a]) => { const s = a.ent-a.sai; L.push(`${nomeProd(k)}: ${s>=0?'sobrou':'faltou'} ${falaR(Math.abs(s))}.`); });
  if (r.chuva) L.push(`Choveu ${fNum(r.chuva)} milímetros no mês.`);
  const al = alertas(); if (al.length) L.push(`Você tem ${al.length} aviso${al.length>1?'s':''}: ` + al.slice(0,4).map(a=>a.t).join('. ') + '.');
  return L.join(' ');
}
function textoProd(){
  const k = ui.prod, m = ui.mes, {ent, sai, sob} = resumoProd(k, m), mesN = MESES[Number(m.slice(5,7))-1];
  const L = [`${nomeProd(k)}, ${mesN}.`, sob>=0 ? `Sobrou ${falaR(sob)}.` : `Faltou ${falaR(-sob)}: gastou mais do que recebeu.`, `Recebeu ${falaR(ent)} e gastou ${falaR(sai)}.`];
  if (k==='leite') { const r = resumo(m), cl = custoLitro(m); if (r.leite) L.push(`Tirou ${fNum(r.leite)} litros de leite.`); if (cl.custo!=null) L.push(`Cada litro custou ${falaR(cl.custo)} para produzir${cl.preco!=null?` e você recebeu ${falaR(cl.preco)} por litro`:''}.`); }

const ordem = (a,b) => a.data < b.data ? 1 : a.data > b.data ? -1 : (b.criado||0) - (a.criado||0);

function graficoChuva(ano){
  const tot = Array(12).fill(0);
  doPer(ano).filter(r=>r.tipo==='chuva').forEach(r => tot[Number(r.data.slice(5,7))-1] += r.mm||0);
  const max = Math.max(...tot);
  if (!max) return `<p class="empty">Nenhuma chuva anotada em ${ano}.</p>`;
  const top = Math.max(50, Math.ceil(max/50)*50);
  const W=340, H=180, L=34, B=26, T=16, cw=(W-L-6)/12;
  const y = v => T + (H-T-B) * (1 - v/top);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chuva por mês em ${ano}">
    ${[0, top/2, top].map(t=>`<line x1="${L}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fNum(t)}</text>`).join('')}
    ${tot.map((v,i)=>{
      const x = L + i*cw + cw*0.18, w = cw*0.64, yy = y(v), h = (H-B) - yy;
      return `${v?`<rect x="${x}" y="${yy}" width="${w}" height="${Math.max(h,1)}" rx="3" fill="var(--rain)"/>`:''}
      ${v && v===max ? `<text x="${x+w/2}" y="${yy-4}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--rain)">${fNum(v)}</text>`:''}
      <text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${MES_C[i][0].toUpperCase()}</text>`;
    }).join('')}
  </svg><p class="small muted" style="margin:6px 0 0">Milímetros por mês. Compare a quadra chuvosa de um ano com a do outro.</p>`;
}

/* ---------- detalhe de atividade (balanço) ---------- */

  const vu = vendasPorUnidade(rs), gi = gastosPorItem(rs).slice(0,6), pr = producoes(rs);

      ${unid && unid[1].qtd ? `<div class="result"><span class="muted small">Por ${singular(unid[0])}</span><span class="big">${fR((ent-sai)/unid[1].qtd)}</span><span class="small muted">sobrou em ${fQ(unid[1].qtd)} ${esc(unid[0])} · preço médio ${fR(unid[1].valor/unid[1].qtd)}</span></div>`:''}
      ${vu.length ? `<section class="section"><h2 style="font-size:17px">O que vendeu ou recebeu</h2><div class="table-wrap"><table><thead><tr><th>Item</th><th class="n">Qtd.</th><th class="n">Preço R$</th><th class="n">Total R$</th></tr></thead><tbody>
        ${vu.map(v=>`<tr><td>${esc(v.desc)}</td><td class="n">${fQ(v.qtd)} ${esc(v.unidade)}</td><td class="n">${fV(v.valor/v.qtd)}</td><td class="n">${fV(v.valor)}</td></tr>`).join('')}
      </tbody></table></div></section>`:''}
      ${gi.length ? `<section class="section"><h2 style="font-size:17px">Onde gastou</h2><div class="table-wrap"><table><tbody>
        ${gi.map(g=>`<tr><td>${esc(g.desc)}</td><td class="n">${fR(g.valor)}</td><td class="n muted">${sai?fNum(g.valor/sai*100):0}%</td></tr>`).join('')}
      </tbody></table></div></section>`:''}
      ${pr.length ? `<section class="section"><h2 style="font-size:17px">Produção</h2><div class="table-wrap"><table><tbody>
        ${pr.map(x=>`<tr><td>${esc(x.produto)}</td><td class="n">${fQ(x.qtd)} ${esc(x.unidade)}</td><td class="n muted">${x.litros?fNum(x.litros/x.qtdComLeite,1)+' L/'+singular(x.unidade):''}</td></tr>`).join('')}
      </tbody></table></div></section>`:''}
      <section class="section"><h2 style="font-size:17px">Anotações</h2>${listaRegistros(rs.sort(ordem).slice(0,40))}</section>

/* ---------- lista de registros ---------- */
function descRegistro(r){
  const a = r.ativ ? ativNome(r.ativ) : '';
  const qt = r.qtd ? ` · ${fQ(r.qtd)} ${r.unidade||''}` : '';
  switch(r.tipo){
    case 'chuva': return {t:'Chuva', s:fData(r.data), v:`${fQ(r.mm)} mm`, c:'rain'};
    case 'leite': { const an = S.animais.find(x=>x.id===r.animal); const mt = [r.manha!=null?`manhã ${fQ(r.manha)} L`:'', r.tarde!=null?`tarde ${fQ(r.tarde)} L`:''].filter(Boolean).join(' · '); return {t:(r.ativ==='caprinos'?'Leite de cabra':'Leite') + (an?` · ${an.nome}`:''), s:fData(r.data) + (mt?` · ${mt}`:''), v:`${fQ(r.litros)} L`, c:''}; }
    case 'producao': return {t:r.produto, s:`${fData(r.data)} · ${a}${r.litrosUsados?` · ${fQ(r.litrosUsados)} L de leite`:''}`, v:`${fQ(r.qtd)} ${r.unidade}`, c:''};
    case 'gasto': return {t:r.desc||'Gasto', s:`${fData(r.data)} · ${a}${qt}`, v:'−'+fR(r.valor), c:'neg'};
    case 'venda': return {t:r.desc||'Venda', s:`${fData(r.data)} · ${a}${qt}`, v:fR(r.valor), c:'pos'};
    case 'plantio': return {t:`Plantio de ${r.cultura}`, s:`${fData(r.data)}${r.area?` · ${fQ(r.area)} ${r.unidade}`:''}`, v:'', c:''};
    case 'colheita': return {t:`Colheita de ${r.cultura}`, s:fData(r.data), v:r.qtd?`${fQ(r.qtd)} ${r.unidade}`:'', c:''};
    default: return {t:r.desc||'Anotação', s:`${fData(r.data)}${a?' · '+a:''}`, v:'', c:''};
  }
}
function listaRegistros(rs){
  if (!rs.length) return `<div class="list"><p class="empty">Nada anotado ainda. Toque no botão <b>+</b> embaixo para começar.</p></div>`;
  return `<div class="list">${rs.map(r => { const d = descRegistro(r); return `
    <button class="row" data-act="editReg" data-id="${r.id}">
      <span class="ic ic-${r.tipo}">${ICONS[r.tipo]}</span>
      <span class="tx"><b>${esc(d.t)}</b><span>${esc(d.s)}</span></span>
      ${d.v?`<span class="amt ${d.c}">${esc(d.v)}</span>`:''}
    </button>`;}).join('')}</div>`;
}

/* ---------- CADERNO ---------- */
function telaCaderno(){
  const filtros = [['todos','Tudo'],['dinheiro','Vendas e gastos'],['leite','Leite'],['producao','Produção'],['chuva','Chuva'],['lavoura','Plantio e colheita'],['anotacao','Anotações']];
  let rs = [...S.registros].sort(ordem);
  const f = ui.filtro;
  if (f==='dinheiro') rs = rs.filter(r=>r.tipo==='gasto'||r.tipo==='venda');
  else if (f==='lavoura') rs = rs.filter(r=>r.tipo==='plantio'||r.tipo==='colheita');
  else if (f!=='todos') rs = rs.filter(r=>r.tipo===f);
  const grupos = {};
  rs.forEach(r => (grupos[r.data.slice(0,7)] ||= []).push(r));
  const meses = Object.keys(grupos).sort().reverse();
  return `
  <div class="section-h"><h1 class="h1">Caderno</h1><span class="muted small">${S.registros.length} anotações</span></div>
  <div class="chips" role="group" aria-label="Filtrar">${filtros.map(([k,n])=>`<button class="chip" data-act="filtro" data-f="${k}" aria-pressed="${f===k}">${n}</button>`).join('')}</div>
  ${meses.length ? meses.map(m => { const [y,mm]=m.split('-').map(Number); return `
    <section class="section"><div class="section-h"><p class="eyebrow">${MESES[mm-1]} ${y}</p>${resumoGrupo(grupos[m], f)}</div>${listaRegistros(grupos[m].slice(0,200))}</section>`; }).join('')
  : listaRegistros([])}`;
}
function resumoGrupo(rs, f){
  if (f==='chuva') return `<span class="small muted num">${fNum(rs.reduce((s,r)=>s+(r.mm||0),0))} mm</span>`;
  if (f==='leite') return `<span class="small muted num">${fNum(rs.reduce((s,r)=>s+(r.litros||0),0))} L</span>`;
  if (f==='dinheiro') { const s = rs.reduce((s,r)=>s+(r.tipo==='venda'?r.valor:-r.valor),0); return `<span class="small num" style="color:${s>=0?'var(--good)':'var(--bad)'};font-weight:700">${fR(s)}</span>`; }
  return '';
}

function ligarAtiv(root){
  $$('.atchips', root).forEach(box => {
    const sel = $('#'+box.dataset.for, root);
    const sync = () => $$('.chip', box).forEach(c => c.setAttribute('aria-pressed', c.dataset.k===sel.value));
    $$('.chip', box).forEach(c => c.onclick = () => { sel.value = c.dataset.k; sel.dispatchEvent(new Event('change')); sync(); });

function ultimo(fn){ return [...S.registros].sort(ordem).find(fn); }

const SUG_DESC = {

};
function formRegistro(tipo, reg, pre){

    <div class="field"><label for="fUn">Medida</label>${selUn('fUn', r.unidade||'tarefas', ['tarefas','hectares','canteiros','covas','linhas'])}</div></div>
    <div class="field"><label for="fDesc">Observação</label><input id="fDesc" value="${esc(r.desc||'')}" placeholder="Ex.: semente do Hora de Plantar"></div>`;

  if (tipo==='colheita') campos += `<div class="field"><label for="fCult">Cultura</label><select id="fCult">${CULTURAS.map(c=>`<option ${r.cultura===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="inline"><div class="field"><label for="fQtd">Quantidade</label><input id="fQtd" inputmode="decimal" value="${v(r.qtd)}" placeholder="Ex.: 12" required></div>
    <div class="field"><label for="fUn">Medida</label>${selUn('fUn', r.unidade||'sacos de 60 kg', ['sacos de 60 kg','kg','maços','caixas','unidades','toneladas'])}</div></div>
    <div class="field"><label for="fDesc">Observação</label><input id="fDesc" value="${esc(r.desc||'')}" placeholder="Opcional"></div>`;

  if (tipo==='anotacao') campos += `${selAtiv('fAtiv', r.ativ, null, fixo)}<div class="field"><label for="fDesc">O que foi feito ou observado?</label><textarea id="fDesc" placeholder="Ex.: vermifuguei os garrotes; apareceu lagarta no milho">${esc(r.desc||'')}</textarea></div>`;

  abrirFolha(reg ? 'Mudar anotação' : TIPOS[tipo].tit, `
    <form class="form" id="fReg" novalidate>${campos}
      <p class="erro" id="fErro" hidden></p>
      <button class="btn primary block" type="submit">${reg?'Salvar alterações':'Anotar'}</button>
      ${reg?`<button class="btn danger block" type="button" data-act="del">Apagar esta anotação</button>`:''}
    </form>`, f => {
      const form = $('#fReg', f);

      // leite: vaca ou cabra e lista de animais
      let leiteDe = r.ativ==='caprinos' ? 'caprinos' : 'leite';
      const encherAnimais = () => {
        const sel = $('#fAnimal', form); if (!sel) return;
        const as = S.animais.filter(a=>a.ativ===leiteDe && a.modo==='animal' && a.sexo==='F');
        sel.innerHTML = `<option value="">${leiteDe==='caprinos'?'Todas as cabras (total)':'Todas as vacas (total)'}</option>` + as.map(a=>`<option value="${a.id}" ${r.animal===a.id?'selected':''}>${esc(a.nome)}</option>`).join('');
        $('#fAnimalF', form).hidden = !as.length;
      };
      // manhã e tarde: de tarde, completa a anotação que já existe no dia
      let alvo = null;
      const totLeite = () => {
        const m = num(g('fManha')), t = num(g('fTarde')), d = num(g('fTotDia'));
        const tot = (m>0?m:0) + (t>0?t:0) || (d>0?d:0);
        $('#fLeiteTot', form).innerHTML = `<span>Total do dia</span><b>${fQ(tot)} litros</b>`;
      };
      const procurarDia = () => {
        if (reg) return;
        const dia = g('fData'), an = g('fAnimal') || '';
        const ex = S.registros.find(x => x.tipo==='leite' && x.data===dia && (x.ativ||'leite')===leiteDe && (x.animal||'')===an);
        const av = $('#fLeiteAviso', form), mI = $('#fManha', form), tI = $('#fTarde', form), dF = $('#fTotDiaF', form), dI = $('#fTotDia', form);
        [mI, tI, dI].forEach(i => { if (i.dataset.auto) { i.value = ''; delete i.dataset.auto; } });
        alvo = ex || null;
        if (ex) {
          if (ex.manha!=null && !mI.value) { mI.value = String(ex.manha).replace('.',','); mI.dataset.auto = '1'; }
          if (ex.tarde!=null && !tI.value) { tI.value = String(ex.tarde).replace('.',','); tI.dataset.auto = '1'; }
          const legado = ex.manha==null && ex.tarde==null;

        } else { av.hidden = true; dF.hidden = true; }

      };
      if (tipo==='leite') {
        encherAnimais();
        $$('#fLeiteDe button', form).forEach(b => b.onclick = () => { leiteDe = b.dataset.v; $$('#fLeiteDe button', form).forEach(y=>y.setAttribute('aria-pressed', y===b)); encherAnimais(); procurarDia(); });
        ['fManha','fTarde','fTotDia'].forEach(id => $('#'+id, form).addEventListener('input', e => { delete e.target.dataset.auto; totLeite(); }));
        $('#fData', form).addEventListener('change', procurarDia);
        $('#fAnimal', form).addEventListener('change', procurarDia);
        procurarDia();
        if (alvo) $('#fReg button[type=submit]', f).textContent = 'Salvar';
      }

      // produção: sugere atividade e unidade pelo produto; rendimento do queijo
      if (tipo==='producao') {
        const prod = $('#fProd', form), un = $('#fUn', form), at = $('#fAtiv', form);
        const rend = () => { const q = num(g('fQtd')), l = num(g('fLitrosQ')); $('#fRend', form).textContent = q>0 && l>0 ? `Rendimento: ${fNum(l/q,1)} litros por ${singular(un.value)}` : 'O app calcula quantos litros vão em cada quilo.'; };
        const ajusta = (inicial) => {
          const p = PRODUTOS[prod.value] || {};
          $('#fLitrosQF', form).hidden = !p.leite;
          $('#fProdOutroF', form).hidden = prod.value !== 'Outro';
          if (!inicial) {
            if (p.un) un.value = p.un;
            if (fixo) { rend(); return; }
            let a = p.ativ;
            if (!a && (prod.value==='Carvão'||prod.value==='Lenha')) { const ex = S.ativExtra.find(x=>x.nome.toLowerCase()===prod.value.toLowerCase()); a = ex && ex.id; }
            if (a && [...at.options].some(o=>o.value===a)) { at.value = a; at.dispatchEvent(new Event('change')); }
          }
          rend();
        };
        prod.onchange = () => ajusta(false); ajusta(!!reg);
        $('#fQtd', form).oninput = rend; $('#fLitrosQ', form).oninput = rend; un.onchange = rend;
        if (!reg) ajusta(false);
      }

      // venda e gasto: total = quantidade × preço
      if (tipo==='venda' || tipo==='gasto') {
        const q = $('#fQtd', form), p = $('#fPreco', form), t = $('#fValor', form), un = $('#fUn', form), at = $('#fAtiv', form);
        let unMexida = !!reg;
        const mostrar = () => {
          const qv = num(q.value), pv = num(p.value), tv = num(t.value);
          const box = $('#fTotal', form);
          let total = tv>0 ? tv : (qv>0 && pv>0 ? qv*pv : 0);
          let extra = '';
          if (qv>0 && tv>0 && !(pv>0)) extra = `<span class="small">${fR(tv/qv)} por ${singular(un.value)}</span>`;
          box.innerHTML = `<span>Total${qv>0&&pv>0?` (${fQ(qv)} × ${fR(pv)})`:''}</span><b>${fR(total)}</b>${extra}`;
        };
        const calc = () => { const qv = num(q.value), pv = num(p.value); if (qv>0 && pv>0) { t.value = fNum(qv*pv, 2); t.dataset.auto='1'; } else if (t.dataset.auto) { t.value=''; delete t.dataset.auto; } mostrar(); };
        q.oninput = calc; p.oninput = calc;
        t.oninput = () => { delete t.dataset.auto; mostrar(); };
        un.onchange = () => { unMexida = true; $('#fPrecoL', form).textContent = `Preço por ${singular(un.value)} (R$)`; mostrar(); };
        at.onchange = () => { if (!unMexida) { un.value = unPadrao(tipo, at.value); $('#fPrecoL', form).textContent = `Preço por ${singular(un.value)} (R$)`; } };
        if (reg && reg.qtd && reg.preco) t.dataset.auto = '1';
        mostrar();
      }

      const first = tipo==='leite' ? $(new Date().getHours()>=12 ? '#fTarde' : '#fManha', form) : $('input:not([type=date]),textarea', form); if (first && !reg) setTimeout(()=>first.focus(), 80);
      form.onsubmit = e => {
        e.preventDefault();
        const novo = Object.assign({}, r, {tipo, data: g('fData') || hoje()});
        const erro = msg => { const p=$('#fErro',form); p.textContent=msg; p.hidden=false; };
        if (tipo==='chuva'){ novo.mm = num(g('fMm')); if (!(novo.mm>=0)) return erro('Escreva quantos milímetros choveu.'); }
        if (tipo==='leite'){
          const m = num(g('fManha')), t = num(g('fTarde')), d = num(g('fTotDia'));
          novo.animal = g('fAnimal')||''; novo.ativ = leiteDe;
          if (m>0 || t>0) { novo.manha = m>0 ? m : null; novo.tarde = t>0 ? t : null; novo.litros = (m>0?m:0) + (t>0?t:0); }
          else if (d>0) { novo.manha = null; novo.tarde = null; novo.litros = d; }
          else return erro('Escreva quantos litros tirou de manhã ou de tarde.');
          if (!reg && alvo) {
            S.registros = S.registros.map(x => x.id===alvo.id ? Object.assign({}, x, novo, {id:x.id, criado:x.criado}) : x);
            S.registros.forEach(x => { if (x.id===alvo.id) delete x.ex; });
            save(); fecharFolha(); render(); toast(`Leite do dia: ${fQ(novo.litros)} litros`); return;
          }
        }
        if (tipo==='producao'){
          novo.produto = g('fProd')==='Outro' ? (g('fProdOutro')||'Outro') : g('fProd');
          novo.qtd = num(g('fQtd')); novo.unidade = g('fUn'); novo.ativ = g('fAtiv'); novo.desc = g('fDesc');
          const l = num(g('fLitrosQ')); novo.litrosUsados = (PRODUTOS[g('fProd')]||{}).leite && l>0 ? l : null;
          if (!(novo.qtd>0)) return erro('Escreva quanto produziu.');
        }
        if (tipo==='gasto'||tipo==='venda'){
          novo.ativ=g('fAtiv'); novo.desc=g('fDesc'); novo.unidade=g('fUn');
          const q = num(g('fQtd')), p = num(g('fPreco')); let t = num(g('fValor'));
          if (!(t>0) && q>0 && p>0) t = q*p;
          if (!(t>0)) return erro('Escreva o valor total, ou a quantidade e o preço.');
          novo.valor = Math.round(t*100)/100; novo.qtd = q>0 ? q : null;
          novo.preco = p>0 ? p : (q>0 ? novo.valor/q : null);
        }
        if (tipo==='plantio'){ novo.cultura=g('fCult'); const a=num(g('fArea')); novo.area=a>0?a:null; novo.unidade=g('fUn'); novo.desc=g('fDesc'); novo.ativ = fixo ? r.ativ : HORTALICAS.includes(novo.cultura)?'horta':'graos'; }
        if (tipo==='colheita'){ novo.cultura=g('fCult'); novo.qtd=num(g('fQtd')); novo.unidade=g('fUn'); novo.desc=g('fDesc'); if (!(novo.qtd>0)) return erro('Escreva quanto colheu.'); novo.ativ = fixo ? r.ativ : HORTALICAS.includes(novo.cultura)?'horta':'graos'; }
        if (tipo==='anotacao'){ novo.ativ=g('fAtiv'); novo.desc=g('fDesc'); if (!novo.desc) return erro('Escreva a anotação.'); }
        if (reg) { delete novo.ex; S.registros = S.registros.map(x => x.id===reg.id ? novo : x); }
        else { novo.id = uid(); novo.criado = Date.now(); S.registros.push(novo); }
        save(); fecharFolha(); render();
        toast(reg ? 'Alteração salva' : tipo==='venda' ? `Anotado: recebeu ${fR(novo.valor)}` : tipo==='gasto' ? `Anotado: gastou ${fR(novo.valor)}` : 'Anotado');
      };
      const del = $('[data-act="del"]', form);
      if (del) confirmar(del, () => { S.registros = S.registros.filter(x=>x.id!==reg.id); save(); fecharFolha(); render(); toast('Anotação apagada'); });
    });
}
function confirmar(btn, fn){
  let armado = false, t;
  const txt = btn.textContent;
  btn.onclick = () => {
    if (armado) { clearTimeout(t); fn(); return; }
    armado = true; btn.textContent = 'Toque de novo para confirmar'; btn.classList.add('primary'); btn.classList.remove('danger');
    t = setTimeout(()=>{ armado=false; btn.textContent=txt; btn.classList.remove('primary'); btn.classList.add('danger'); }, 4000);
  };
}

/* ---------- CRIAÇÃO ---------- */
const qtdAnimal = a => a.modo==='lote' ? (a.qtd||0) : 1;
function iconeAtiv(k){ const [i,c] = ICON_ATIV[k] || ['vaca','ic-cria']; return `<span class="ic ${c}">${ICONS[i]}</span>`; }
function telaCriacao(){
  const f = ui.cria;
  const usadas = [...new Set([...criacoesAtivas(), ...S.animais.map(a=>a.ativ)])].filter(k=>CRIA[k]);
  let as = S.animais.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{numeric:true}));
  if (f!=='todos') as = as.filter(a=>a.ativ===f);
  const contagem = usadas.map(k => [k, S.animais.filter(a=>a.ativ===k).reduce((s,a)=>s+qtdAnimal(a),0)]).filter(([,n])=>n>0);
  return `
  <div class="section-h"><h1 class="h1">Criação</h1><button class="btn sm primary" data-act="novoAnimal">+ Animal ou lote</button></div>
  ${contagem.length ? `<div class="stats">${contagem.map(([k,n])=>`<div class="stat"><span class="k">${esc(ativ(k).nome)}</span><span class="v">${fNum(n)}</span><span class="s">${statCria(k)}</span></div>`).join('')}</div>`:''}
  <div class="chips"><button class="chip" data-act="criaF" data-f="todos" aria-pressed="${f==='todos'}">Todos</button>${usadas.map(k=>`<button class="chip" data-act="criaF" data-f="${k}" aria-pressed="${f===k}">${esc(ativNome(k))}</button>`).join('')}</div>
  ${as.length ? `<div class="list">${as.map(cardAnimal).join('')}</div>`
   : `<div class="list"><p class="empty">Cadastre seus animais um por um (vacas, cavalos, matrizes) ou em lotes (galinhas, peixes, um rebanho de cabras). O app avisa de cio e parto, controla nascimentos, mortes e vendas e acompanha o ganho de peso.</p></div>`}
  <div class="card small muted">Gestação média usada nos avisos: vaca 283 dias, égua cerca de 340, cabra e ovelha 150, porca 114. Secagem da vaca: 60 dias antes do parto. São médias: confirme a prenhez com o veterinário.</div>`;
}
function statCria(k){
  const as = S.animais.filter(a=>a.ativ===k);
  const prenhas = as.filter(a=>situacao(a).prenha).length;
  if (prenhas) return `${prenhas} prenha${prenhas===1?'':'s'}`;
  const lotes = as.filter(a=>a.modo==='lote').length;
  return lotes ? `${lotes} lote${lotes===1?'':'s'}` : `${as.length} cadastrado${as.length===1?'':'s'}`;
}
function ultPeso(a){ return (a.pesagens||[]).slice().sort((x,y)=>x.data<y.data?-1:1).at(-1); }
function gmd(a){
  const p = (a.pesagens||[]).slice().sort((x,y)=>x.data<y.data?-1:1);
  if (p.length < 2) return null;
  const u = p.at(-1), pen = p.at(-2), pr = p[0];
  const dU = diffDias(pen.data, u.data), dT = diffDias(pr.data, u.data);
  return { ultimo: dU>0 ? (u.peso-pen.peso)/dU : null, total: dT>0 ? (u.peso-pr.peso)/dT : null, peso:u.peso, data:u.data, dias:dU };
}
function cardAnimal(a){
  const pills = [];
  let sub = esc(ativ(a.ativ).nome) + (a.raca ? ' · ' + esc(a.raca) : '');
  if (a.modo==='lote') {
    pills.push(`<span class="pill gray">${fNum(a.qtd||0)} ${CRIA[a.ativ]&&CRIA[a.ativ].un||'cabeças'}</span>`);
    const p = ultPeso(a); if (p) pills.push(`<span class="pill gray">peso médio ${fQ(p.peso)} kg</span>`);
  } else {
    const s = situacao(a);
    if (s.prenha) {
      pills.push(`<span class="pill good">Prenha · parto ${fDataC(s.parto)}</span>`);
      if (s.secar) { const ds = diffDias(hoje(), s.secar);
        if (ds > 0 && ds <= 15) pills.push(`<span class="pill warn">Secar ${quando(s.secar)}</span>`);
        else if (ds <= 0 && diffDias(hoje(), s.parto) > 0) pills.push(`<span class="pill gray">Período seco desde ${fDataC(s.secar)}</span>`); }
    } else if (s.proxCio) pills.push(`<span class="pill gray">Cio previsto ${fDataC(s.proxCio)}</span>`);
    if (!s.prenha && s.diasParida != null) pills.push(`<span class="pill ${a.ativ==='leite'&&s.diasParida>90?'warn':'gray'}">Pariu há ${s.diasParida} dias</span>`);
    const p = ultPeso(a); if (p) sub += ` · ${fQ(p.peso)} kg`;
    const g = gmd(a); if (g && g.ultimo!=null) pills.push(`<span class="pill ${g.ultimo>=0.5?'good':g.ultimo>0?'warn':'red'}">Ganho ${fNum(g.ultimo*1000)} g/dia</span>`);
    if (a.sexo==='M' && !pills.length) pills.push(`<span class="pill gray">Macho</span>`);
  }
  return `<button class="row" data-act="verAnimal" data-id="${a.id}">
    ${iconeAtiv(a.ativ)}
    <span class="tx"><b>${esc(a.nome)}</b><span>${sub}</span>${pills.length?`<span class="pills">${pills.join('')}</span>`:''}</span>
  </button>`;
}
function formAnimal(a){
  const cria0 = criacoesAtivas();
  const x = a || {ativ: ui.cria!=='todos' ? ui.cria : (cria0[0]||'leite'), modo:'animal', sexo:'F', nome:'', raca:''};
  const lista = [...new Set([...cria0, x.ativ])].filter(k=>CRIA[k]);
  abrirFolha(a?'Editar':'Cadastrar na criação', `
    <form class="form" id="fAn" novalidate>
      <div class="field"><label for="anAtiv">Criação</label><select id="anAtiv">${lista.map(k=>`<option value="${k}" ${x.ativ===k?'selected':''}>${esc(ativ(k).nome)}</option>`).join('')}</select></div>
      <div class="field" id="anModoF"><label>Como quer controlar?</label><div class="seg" id="anModo"><button type="button" data-v="animal" aria-pressed="${x.modo==='animal'}">Um animal</button><button type="button" data-v="lote" aria-pressed="${x.modo==='lote'}">Um lote (grupo)</button></div>

function blocoPeso(a, lote){

      ${p.slice().reverse().map((x,i,arr)=>{ const ant = arr[i+1]; const d = ant?diffDias(ant.data,x.data):0; const gg = ant&&d>0?(x.peso-ant.peso)/d:null; return `<tr><td>${fData(x.data)}</td><td class="n">${fQ(x.peso)} kg</td><td class="n">${gg!=null?fNum(gg*1000)+' g':'—'}</td></tr>`; }).join('')}
    </tbody></table></div>` : ''}`;

function graficoPeso(p){
  const W=340,H=150,L=38,B=24,T=14;
  const min = Math.min(...p.map(x=>x.peso)), max = Math.max(...p.map(x=>x.peso));
  const step = max < 10 ? 0.5 : 10;
  const lo = Math.max(0, Math.floor((min-step)/step)*step), hi = Math.ceil((max+step)/step)*step;
  const d0 = p[0].data, dn = Math.max(1, diffDias(d0, p.at(-1).data));
  const X = d => L + (W-L-12) * diffDias(d0, d)/dn, Y = v => T + (H-T-B)*(1-(v-lo)/(hi-lo));
  const pts = p.map(x=>`${X(x.data)},${Y(x.peso)}`).join(' ');
  return `<div class="card"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do peso">
    ${[lo,(lo+hi)/2,hi].map(t=>`<line x1="${L}" x2="${W-6}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fQ(t)}</text>`).join('')}
    <polygon points="${X(p[0].data)},${H-B} ${pts} ${X(p.at(-1).data)},${H-B}" fill="var(--red-soft)"/>
    <polyline points="${pts}" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linejoin="round"/>
    ${p.map((x,i)=>`<circle cx="${X(x.data)}" cy="${Y(x.peso)}" r="${i===p.length-1?5:3.5}" fill="${i===p.length-1?'var(--red)':'var(--surface)'}" stroke="var(--red)" stroke-width="2"/>`).join('')}
    <text x="${L}" y="${H-6}" font-size="10" fill="var(--muted)">${fDataC(p[0].data)}</text>
    <text x="${W-6}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--muted)">${fDataC(p.at(-1).data)}</text>
  </svg><p class="small muted" style="margin:4px 0 0">Peso em kg</p></div>`;
}

function calcVendaRun(f, g){

function dadosRelatorio(p){

  const ehAno = p.length===4;

  const nasc = rs.filter(x=>x.evento==='parto').reduce((s,x)=>s+(x.crias||1),0);
  const mortesInd = rs.filter(x=>x.evento==='morte').length;
  let nascLote=0, mortLote=0, vendLote=0;
  S.animais.forEach(a => (a.movs||[]).filter(m=>m.data.startsWith(p)).forEach(m => { if (m.tipo==='nasceu') nascLote+=m.qtd; if (m.tipo==='morreu') mortLote+=m.qtd; if (m.tipo==='vendeu') vendLote+=m.qtd; }));
  const vendInd = rs.filter(x=>x.tipo==='venda' && x.desc && x.desc.startsWith('Venda · ') && x.unidade==='cabeças' && x.qtd===1).length;
  const plantel = [...new Set(S.animais.map(a=>a.ativ))].map(k=>({nome:ativ(k).nome, n:S.animais.filter(a=>a.ativ===k).reduce((s,a)=>s+qtdAnimal(a),0)})).filter(x=>x.n);
  return {p, ehAno, r, rAnt, ant, atividades, prods:producoes(rs), colh:rs.filter(x=>x.tipo==='colheita'), plantios:rs.filter(x=>x.tipo==='plantio'),
    vendas:vendasPorUnidade(rs).slice(0,8), gastos:gastosPorItem(rs).slice(0,6), cl:custoLitro(p),
    chuvaAno: resumo(p.slice(0,4)).chuva, nasc:nasc+nascLote, mortes:mortesInd+mortLote, vendAnimais:vendInd+vendLote, plantel,
    mediaLeite: r.diasLeite ? r.leite/r.diasLeite : 0};
}

function textoRelatorio(p){
  const d = dadosRelatorio(p), r = d.r;
  const L = [];
  L.push(`*${d.ehAno?`Relatório do ano de ${p}`:`Relatório de ${MESES[Number(p.slice(5,7))-1]} de ${p.slice(0,4)}`}*${S.nome?` · ${S.nome}`:''}`);
  L.push('');
  L.push(`💰 Recebi ${fR(r.ent)} · Gastei ${fR(r.sai)}`);
  L.push(`*Sobrou: ${fR(r.saldo)}*`);
  if (d.atividades.length) { L.push(''); L.push('*Por produção*'); d.atividades.forEach(a=>L.push(`• ${a.nome}: ${fR(a.res)}`)); }
  const prod = [];
  if (r.leite) prod.push(`• Leite: ${fNum(r.leite)} L`);
  if (r.leiteCabra) prod.push(`• Leite de cabra: ${fQ(r.leiteCabra)} L`);
  d.prods.forEach(x=>prod.push(`• ${x.produto}: ${fQ(x.qtd)} ${x.unidade}${x.litros?` (${fNum(x.litros/x.qtdComLeite,1)} L de leite por ${singular(x.unidade)})`:''}`));
  d.colh.forEach(x=>prod.push(`• Colheita de ${x.cultura}: ${fQ(x.qtd)} ${x.unidade}`));
  if (prod.length) { L.push(''); L.push('*Produção*'); L.push(...prod); }
  if (d.cl.custo!=null) L.push(`Custo do litro de leite: ${fR(d.cl.custo)}${d.cl.preco!=null?` · recebido: ${fR(d.cl.preco)}`:''}`);
  if (d.gastos.length) { L.push(''); L.push('*Maiores gastos*'); d.gastos.slice(0,4).forEach(g=>L.push(`• ${g.desc}: ${fR(g.valor)}`)); }
  if (d.nasc||d.mortes||d.vendAnimais) { L.push(''); L.push(`*Criação:* ${d.nasc} nascimento(s) · ${d.vendAnimais} vendido(s) · ${d.mortes} morte(s)`); }
  L.push(''); L.push(`🌧️ Chuva: ${fNum(r.chuva)} mm`);
  L.push(''); L.push('_Feito com o Caderno da Roça_');
  return L.join('\n');
}

  <ul><li><b>Mal do caroço</b> (linfadenite caseosa): caroços no pescoço, perto da orelha ou na virilha. Separe o animal e não deixe o caroço estourar no chiqueiro, porque o pus contamina os outros.</li>
  <li><b>Boqueira</b> (ectima): feridas na boca dos cabritos e borregos. Separe e trate com orientação.</li>
  <li><b>Casco:</b> apare de tempos em tempos e mantenha o chiqueiro seco.</li></ul>
  <h3>Reprodução</h3>
  <table><tbody><tr><td>Cio da cabra</td><td class="n">a cada 21 dias</td></tr><tr><td>Cio da ovelha</td><td class="n">a cada 17 dias</td></tr><tr><td>Gestação</td><td class="n">cerca de 150 dias (5 meses)</td></tr></tbody></table>
  <ul><li>A cria precisa mamar o colostro nas primeiras horas de vida.</li><li>Corte e cure o umbigo com iodo logo ao nascer.</li></ul>
  <h3>Instalações e comida</h3>
  <ul><li>Chiqueiro (aprisco) coberto, seco e limpo. Piso ripado suspenso ajuda a cortar o ciclo do verme.</li>
  <li>Água limpa, sal mineral e reserva de forragem para a seca.</li></ul>
  <div class="caution">Ovelha é sensível a cobre. Use sal mineral feito para ovinos: sal de gado ou de cabra pode intoxicar ovelhas.</div>
  <div class="tip">A Embrapa Caprinos e Ovinos fica em Sobral (CE) e tem cartilhas gratuitas para o semiárido.</div>`},
 {id:'porcos', f:'suinos', t:'Porcos: criação e saúde', r:'Higiene, água limpa e lavagem cozida.', h:`
  <h3>Reprodução</h3>
  <table><tbody><tr><td>Cio da porca</td><td class="n">a cada 21 dias, dura 2 a 3 dias</td></tr><tr><td>Gestação</td><td class="n">114 dias (3 meses, 3 semanas e 3 dias)</td></tr></tbody></table>
  <h3>Chiqueiro</h3>
  <ul><li>Piso firme com caimento para escorrer, sombra e lugar seco para deitar.</li>
  <li>Água limpa à vontade. Porca amamentando bebe muita água.</li>
  <li>Limpe todo dia. Esterco acumulado traz mosca, verme e doença.</li></ul>
  <h3>Leitões</h3>
  <ul><li>Precisam mamar o colostro e ficar aquecidos nos primeiros dias.</li>
  <li>Leitão criado em piso de cimento, sem acesso à terra, costuma precisar de ferro injetável nos primeiros dias. Peça orientação técnica.</li></ul>
  <h3>Comida</h3>
  <ul><li>Ração ou mistura de milho com farelo de soja, mais restos de horta e soro de queijo.</li>
  <li>Lavagem com restos de comida deve ser <b>bem cozida</b>. Restos crus com carne podem transmitir doenças graves, como a peste suína.</li></ul>
  <div class="caution">Porcos morrendo sem explicação, com febre e manchas vermelhas na pele: avise a Adagri. A peste suína clássica ainda aparece no Nordeste.</div>`},
 {id:'galinhas', f:'aves', t:'Galinha caipira e ovos', r:'Galinheiro arejado, vacina e ovo bem guardado.', h:`
  <h3>Galinheiro</h3>
  <ul><li>Arejado, com sombra, poleiros e cama seca de palha ou maravalha.</li>
  <li>Um ninho para cada 4 ou 5 galinhas, em lugar escuro e calmo.</li>
  <li>Cerca ou tela para proteger de raposa, gato e gavião à noite.</li></ul>
  <h3>Comida e água</h3>
  <ul><li>Milho, ração ou farelo, mais verduras e restos de horta.</li>
  <li>Água limpa sempre, trocada todo dia.</li>
  <li>Calcário ou casca de ovo moída à vontade deixa a casca do ovo mais forte.</li></ul>
  <h3>Saúde</h3>

  <li>Separe a ave doente logo.</li></ul>
  <h3>Choco e pintinhos</h3>

  <div class="caution">Muitas aves morrendo de repente: não mexa sem luva, separe as doentes e avise a Adagri.</div>`},
 {id:'equinos', f:'equinos', t:'Cavalos, jumentos e burros', r:'Casco, dente, vacina e exames para transporte.', h:`
  <ul><li><b>Casco:</b> limpe e apare com frequência. Casco crescido demais machuca a perna.</li>
  <li><b>Dentes:</b> pontas nos dentes atrapalham a mastigação e o animal emagrece. Peça avaliação ao veterinário.</li>
  <li><b>Água:</b> limpa e à vontade. Um cavalo bebe dezenas de litros por dia, mais no calor e no trabalho.</li>
  <li><b>Vacinas:</b> raiva e tétano, e outras conforme orientação do veterinário.</li>
  <li><b>Feridas e arreios:</b> trate as feridas logo para não dar bicheira. Arreio e cangalha que machucam devem ser ajustados.</li>
  <li><b>Vermes:</b> vermifugue com orientação técnica.</li></ul>
  <h3>Reprodução</h3>
  <table><tbody><tr><td>Cio da égua</td><td class="n">a cada 21 dias</td></tr><tr><td>Gestação da égua</td><td class="n">cerca de 11 meses</td></tr><tr><td>Gestação da jumenta</td><td class="n">cerca de 12 meses</td></tr></tbody></table>
  <div class="caution">Para transportar equídeos com GTA, inclusive para vaquejada e cavalgada, são exigidos os exames de anemia infecciosa equina e de mormo em dia. Informe-se na Adagri.</div>`},
 {id:'peixes', f:'pesca', t:'Peixes em tanque e açude', r:'Água boa, ração na medida e pesca legal.', h:`
  <h3>Criação em tanque</h3>
  <ul><li><b>Água:</b> cor verde-clara é sinal de água boa. Peixes boquejando na superfície de manhã cedo indicam falta de oxigênio: pare a ração e renove ou agite a água.</li>
  <li><b>Ração:</b> dê só o que o peixe come em poucos minutos e siga a tabela do fabricante pelo peso. Sobra de ração apodrece e estraga a água.</li>
  <li><b>Biometria:</b> a cada 15 a 30 dias, pese alguns peixes e tire a média. Anote no lote como <b>peso médio</b> para ajustar a ração e ver o crescimento.</li>
  <li><b>Despesca:</b> deixe sem ração no dia anterior e conserve o peixe no gelo logo após tirar da água.</li></ul>
  <h3>Pesca no açude</h3>
  <ul><li>Respeite o período de defeso e o tamanho mínimo das espécies.</li>
  <li>Não use rede de malha proibida, bomba ou veneno.</li>
  <li>Pescador profissional artesanal com o Registro Geral da Pesca (RGP) pode ter direito ao Seguro-Defeso.</li></ul>
  <div class="caution">Criar peixe em tanque-rede em açude público precisa de autorização dos órgãos responsáveis pelo açude e pelo meio ambiente.</div>`},
 {id:'canteiros', f:'horta', t:'Canteiros e adubação', r:'Terra fofa e rica em matéria orgânica.', h:`
  <ul><li>Canteiros de 1 a 1,2 m de largura, para alcançar o meio sem pisar. Altura de 15 a 20 cm.</li>
  <li>Misture esterco <b>curtido</b> na terra. Esterco fresco queima as raízes e traz doença.</li>

  <li>Troque a cultura de canteiro a cada ciclo (rotação) para não cansar a terra nem acumular organismos antagônicos.</li></ul>`},
 {id:'irrigacao', f:'horta', t:'Irrigar gastando pouca água', r:'Gotejamento e cobertura morta.', h:`
  <ul><li><b>Gotejamento:</b> a água cai só na raiz. Gasta bem menos que regador e mangueira e evita molhar as folhas.</li>
  <li>Regue de manhã cedo ou no fim da tarde, quando evapora menos.</li>

  <li>Enfie o dedo na terra antes de regar: se estiver úmida a 2 ou 3 cm, espere.</li>
  <li>Água de cisterna e de barreiro é valiosa: use primeiro nas mudas e nas culturas que dão mais retorno.</li></ul>`},
 {id:'pragas', f:'horta', t:'Controle natural de organismos antagônicos', r:'Olhar a horta todo dia é o melhor remédio.', h:`
  <ul><li>Passe pela horta todo dia. Cate lagartas e ovos com a mão no começo do ataque.</li>
  <li><b>Armadilha amarela:</b> plástico amarelo com óleo ou cola pega mosca-branca e pulgão.</li>

  <div class="caution">Mesmo produto natural pode irritar pele e olhos. Use luva e não aplique no sol quente.</div>`},
 {id:'calendario-horta', f:'horta', t:'Tempo até a colheita', r:'Planeje o replantio para ter sempre o que vender.', h:`

 {id:'servicos', f:'servicos', t:'Balanço de serviços e outros trabalhos', r:'Manicure, frete, lenha, pipa: saiba quanto sobra.', h:`
  <p>Todo trabalho que gera dinheiro pode ter seu próprio balanço no app, do mesmo jeito que o leite ou a horta.</p>
  <h3>Como fazer</h3>
  <ol><li>Crie a atividade em <b>Mais › Minhas produções</b>: manicure, lenha, carvão, transporte de leite, comércio de ração, pipa d'água, frete…</li>
  <li>Cada serviço feito ou venda vira uma <b>Venda ou serviço</b>, com a quantidade (viagens, serviços, sacos) e o preço de cada um.</li>
  <li>Cada despesa vira um <b>Gasto</b> na mesma atividade: combustível, material, peça, ração comprada para revender.</li>
  <li>No Início, toque na atividade em <b>Balanço por atividade</b>. O app mostra quanto entrou, quanto saiu e quanto sobra por viagem ou por serviço.</li></ol>
  <h3>Custos que todo mundo esquece</h3>
  <ul><li>Combustível, pneu, óleo e conserto do carro, moto ou caminhão.</li>
  <li>Material que acaba: esmalte e lixa, saco de carvão, lona, mangueira.</li>
  <li>Energia, telefone e internet usados no trabalho.</li>
  <li>O seu próprio dia de trabalho. Se sobra menos que uma diária, o serviço está barato.</li></ul>
  <h3>Exemplo: pipa d'água</h3>
  <p>No mês, 20 viagens a R$ 150 dão R$ 3.000. Se o diesel foi R$ 1.100 e a manutenção R$ 400, sobram R$ 1.500, ou R$ 75 por viagem. Esse é o número para comparar com o preço cobrado.</p>
  <h3>Outras dicas</h3>
  <ul><li>Separe o dinheiro do trabalho do dinheiro da casa.</li>
  <li>Manicure, frete, comércio de ração e outros serviços podem se formalizar como <b>MEI</b> (Microempreendedor Individual). Com a contribuição mensal, a pessoa passa a ter direito a aposentadoria e auxílios do INSS e pode emitir nota.</li>
  <li>Água de pipa para beber precisa vir de fonte segura, ser clorada e ir em tanque limpo.</li></ul>
  <div class="caution">Tirar lenha ou fazer carvão de mata nativa da caatinga exige plano de manejo autorizado pelo órgão ambiental (no Ceará, a SEMACE). Prefira lenha de poda, de manejo autorizado ou de árvores plantadas.</div>`},
 {id:'convivencia', f:'geral', t:'Convivência com o semiárido', r:'Guardar água e comida no tempo bom.', h:`

const FILTROS_GUIA = [['todos','Todos'],['graos','Grãos'],['horta','Horta'],['leite','Leite'],['queijo','Queijo'],['corte','Corte'],['caprinos','Cabras e ovelhas'],['suinos','Porcos'],['aves','Aves'],['equinos','Equinos'],['pesca','Pesca'],['servicos','Serviços'],['geral','Seca']];
function telaGuias(){
  if (ui.guia === 'forragem') return telaForragem();
  if (ui.guia === 'programas') return telaProgramas();
  if (ui.guia) { const g = GUIAS.find(x=>x.id===ui.guia); if (g) return `
    <button class="link" data-act="voltarGuias">‹ Guias</button>
    <article class="article" id="artigo">
      <p class="eyebrow">${(FILTROS_GUIA.find(x=>x[0]===g.f)||[,''])[1]}</p>
      <h1 class="h1">${g.t}</h1>
      ${podeFalar()?`<button class="btn ouvir" data-act="ouvirGuia" style="align-self:flex-start">${ICONS.som} Ouvir esta dica</button>`:''}
      ${g.h}
      <p class="small muted" style="border-top:1px solid var(--line);padding-top:12px;margin:0">Orientação geral. Para o seu caso, procure a Ematerce, o sindicato, um técnico agrícola ou um médico-veterinário.</p>
    </article>`; }
  const f = ui.guiaFiltro;
  const gs = GUIAS.filter(g => f==='todos' || g.f===f);
  return `
  <h1 class="h1">Guias</h1>
  <div class="tiles">
    <button class="tile" data-act="abrirGuia" data-id="forragem"><span class="ic ic-plantio">${ICONS.colheita}</span><b>Reserva de forragem</b><span>Quanta comida guardar para a seca</span></button>
    <button class="tile" data-act="abrirGuia" data-id="programas"><span class="ic ic-venda">${ICONS.venda}</span><b>Programas e apoio</b><span>Pronaf, Garantia-Safra, PAA, MEI</span></button>
  </div>
  <div class="chips">${FILTROS_GUIA.map(([k,n])=>`<button class="chip" data-act="guiaF" data-f="${k}" aria-pressed="${f===k}">${n}</button>`).join('')}</div>
  <div class="list">${gs.map(g=>`<button class="row" data-act="abrirGuia" data-id="${g.id}"><span class="tx"><b>${g.t}</b><span>${g.r}</span></span>${ICONS.next}</button>`).join('')}</div>
  <button class="btn block" data-act="irMais">Mais: minhas produções, lembretes, cópia de segurança</button>`;
}
function telaForragem(){
  const peq = S.animais.filter(a=>a.ativ==='caprinos'||a.ativ==='ovinos').reduce((s,a)=>s+qtdAnimal(a),0);
  const bov = S.animais.filter(a=>a.ativ==='leite'||a.ativ==='corte').length;
  return `
  <button class="link" data-act="voltarGuias">‹ Guias</button>
  <h1 class="h1">Reserva de forragem</h1>
  <p class="muted" style="margin:0">Quanta comida guardar para atravessar a seca. Considera que o gado come, por dia, cerca de 2,5% do próprio peso em matéria seca, e cabras e ovelhas cerca de 3%.</p>
  <form class="form card" id="fForr" onsubmit="return false">
    <div class="inline">
      <div class="field"><label for="frAd">Bois e vacas adultos</label><input id="frAd" inputmode="numeric" value="${bov||10}"></div>
      <div class="field"><label for="frJov">Bezerros e garrotes</label><input id="frJov" inputmode="numeric" value="4"></div>
    </div>
    <div class="inline">
      <div class="field"><label for="frPeso">Peso médio do adulto (kg)</label><input id="frPeso" inputmode="numeric" value="400"></div>
      <div class="field"><label for="frPeq">Cabras e ovelhas</label><input id="frPeq" inputmode="numeric" value="${peq}"></div>
    </div>
    <div class="inline">
      <div class="field"><label for="frMeses">Meses de seca pela frente</label><input id="frMeses" inputmode="numeric" value="${mesesAteChuva()}"></div>
      <div class="field"><label for="frPasto">O pasto ainda dá</label>
        <select id="frPasto"><option value="0">Nada</option><option value="0.25" selected>Um quarto</option><option value="0.5">Metade</option></select></div>
    </div>
  </form>
  <div id="frRes"></div>
  <div class="card small muted">Bezerros e garrotes contam como meio animal adulto. Cabras e ovelhas com 35 kg em média. Silagem com cerca de 30% de matéria seca, palma com cerca de 10% e feno com cerca de 85%. Silo trincheira bem compactado guarda cerca de 550 kg de silagem por metro cúbico.</div>`;
}
function mesesAteChuva(){ const m = new Date().getMonth()+1; return m>=6 ? (12 - m) + 2 : 1; }
function calcForragem(){
  const ad = num($('#frAd').value)||0, jov = num($('#frJov').value)||0, peso = num($('#frPeso').value)||0, peq = num($('#frPeq').value)||0, meses = num($('#frMeses').value)||0, pasto = Number($('#frPasto').value);
  const msDia = ((ad + jov*0.5) * peso * 0.025 + peq * 35 * 0.03) * (1-pasto), dias = meses*30, msTotal = msDia*dias;
  const box = $('#frRes');
  if (!msTotal) { box.innerHTML = `<div class="card"><p class="empty">Preencha os campos acima.</p></div>`; return; }
  const sil = msTotal/0.30/1000, palma = msTotal/0.10/1000, feno = msTotal/0.85/1000, m3 = sil*1000/550;
  box.innerHTML = `<div class="result">
    <span class="muted small">Precisa de matéria seca para ${fNum(dias)} dias</span>
    <span class="big">${fNum(msTotal/1000,1)} toneladas</span>
    <span class="small muted">${fNum(msDia)} kg de matéria seca por dia</span>
  </div>
  <div class="table-wrap"><table><thead><tr><th>Se viesse só de</th><th class="n">Quantidade</th></tr></thead><tbody>
    <tr><td>Silagem</td><td class="n">${fNum(sil,1)} t · silo de ${fNum(m3)} m³</td></tr>
    <tr><td>Feno</td><td class="n">${fNum(feno,1)} t</td></tr>
    <tr><td>Palma (não dar sozinha)</td><td class="n">${fNum(palma,1)} t</td></tr>
  </tbody></table></div>
  <p class="small muted" style="margin:0">Na prática, combine: por exemplo, metade da matéria seca em silagem e o resto entre palma e feno, com sal mineral e água à vontade.</p>`;
}
function telaProgramas(){

    ['Garantia-Safra','Proteção contra perda de safra','O agricultor adere todo ano pelo município. Se a cidade perder pelo menos metade da safra por seca ou excesso de chuva, recebe um benefício.'],

    ['Hora de Plantar','Sementes do Governo do Ceará','Distribui sementes de milho, feijão, sorgo e outras para plantio na quadra chuvosa. Informe-se na secretaria de agricultura do município.'],
    ['RGP e Seguro-Defeso','Para quem vive da pesca','O Registro Geral da Pesca (RGP) reconhece o pescador profissional. Com ele, o pescador artesanal pode receber o Seguro-Defeso no período em que a pesca é proibida.'],
    ['MEI','Microempreendedor Individual','Para quem presta serviço ou vende: manicure, frete, comércio de ração, doces. Com a contribuição mensal, garante aposentadoria e auxílios do INSS e pode emitir nota.'],
    ['Ematerce','Assistência técnica do Ceará','Técnicos que orientam no plantio, na criação, no crédito e na documentação. Procure o escritório que atende o seu município.'],
    ['Adagri','Defesa agropecuária do Ceará','Cadastro dos rebanhos, campanhas de vacinação, emissão da GTA para transportar animais e inspeção de produtos como queijo.'],
