<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderno da Roça</title>
<meta name="description" content="Caderno de campo do produtor rural: chuva, leite, rebanho, gastos, vendas e guias técnicos para o semiárido.">
<meta name="theme-color" content="#1a1311">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderno da Roça">
<style>
/* Layout: cabeçalho escuro fixo, conteúdo em coluna única (máx. 640px), barra de abas fixa embaixo com botões grandes para o polegar */
:root{
  --bg:#f7f5f2; --surface:#ffffff; --surface-2:#f0ece7; --line:#e2dcd5;
  --fg:#1d1715; --muted:#6c615b;
  --red:#b3201b; --red-ink:#ffffff; --red-soft:#f8e3e1;
  --gold:#c98d10; --gold-soft:#fbefd2; --gold-ink:#5b3e00;
  --black:#1a1311;
  --good:#2f7d32; --good-soft:#e2f1e2; --warn:#b26a00; --warn-soft:#fdf0d9; --bad:#b3261e;
  --rain:#2f6fb0; --rain-soft:#e1ecf8;
  --font: "Segoe UI", Roboto, "Noto Sans", system-ui, -apple-system, sans-serif;
  --font-display: "Segoe UI Black", "Arial Black", Roboto, system-ui, sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120f0e; --surface:#1d1816; --surface-2:#272120; --line:#352d2a;
    --fg:#f3ece8; --muted:#a8998f;
    --red:#e0473f; --red-ink:#ffffff; --red-soft:#3a1716;
    --gold:#e9b23c; --gold-soft:#3a2c0e; --gold-ink:#f6d896;
    --black:#0b0908;
    --good:#6cc070; --good-soft:#1c3220; --warn:#f0a940; --warn-soft:#3a2a10; --bad:#ff7a70;
    --rain:#7fb4ec; --rain-soft:#15283c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120f0e; --surface:#1d1816; --surface-2:#272120; --line:#352d2a;
  --fg:#f3ece8; --muted:#a8998f;
  --red:#e0473f; --red-ink:#ffffff; --red-soft:#3a1716;
  --gold:#e9b23c; --gold-soft:#3a2c0e; --gold-ink:#f6d896;
  --black:#0b0908;
  --good:#6cc070; --good-soft:#1c3220; --warn:#f0a940; --warn-soft:#3a2a10; --bad:#ff7a70;
  --rain:#7fb4ec; --rain-soft:#15283c;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
.num{font-variant-numeric:tabular-nums}

/* Cabeçalho */
.top{position:sticky;top:0;z-index:20;background:var(--black);color:#fff;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--font-display);font-size:20px;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;font-size:13px;color:#d9c9a3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .spacer{flex:1}
.top-stripe{height:4px;background:linear-gradient(90deg,var(--red) 0 70%,#e9b23c 70% 100%)}

main{max-width:640px;margin:0 auto;padding-block:16px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}

/* Abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted);cursor:pointer;min-height:64px}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--red);font-weight:700}
.tab.plus .bubble{width:46px;height:46px;border-radius:50%;background:var(--red);color:var(--red-ink);display:grid;place-items:center;margin-top:-20px;box-shadow:0 4px 12px rgba(0,0,0,.25);border:3px solid var(--surface)}
.tab.plus .bubble svg{width:28px;height:28px}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,.tile:focus-visible,.row:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Blocos */
.section{display:flex;flex-direction:column;gap:10px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.section-h h2{font-size:19px;font-weight:800}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.link{align-self:flex-start;background:none;border:0;color:var(--red);font-weight:700;cursor:pointer;padding:6px 0;font-size:15px}

.banner{background:var(--gold-soft);color:var(--gold-ink);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.banner .btn{align-self:flex-start}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h1{font-size:24px;font-family:var(--font-display);text-transform:capitalize}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn:disabled{opacity:.35}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .v small{font-size:15px;font-weight:600;color:var(--muted)}
.stat .s{font-size:13px;color:var(--muted)}
.stat.rain .v{color:var(--rain)}
.stat.money.pos .v{color:var(--good)}
.stat.money.neg .v{color:var(--bad)}

/* Barras de lucro */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.bar-row .lbl{font-weight:700;font-size:15px}
.bar-track{position:relative;height:30px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.bar-fill{position:absolute;top:0;bottom:0;border-radius:8px}
.bar-val{position:absolute;inset:0;display:flex;align-items:center;padding:0 10px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.bar-sub{grid-column:2;font-size:13px;color:var(--muted);margin-top:-6px}

.chart{width:100%;height:auto;display:block}

/* Listas */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;cursor:pointer}
.row:last-child{border-bottom:0}
.row .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.row .ic svg{width:22px;height:22px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px}
.amt.pos{color:var(--good)} .amt.neg{color:var(--bad)} .amt.rain{color:var(--rain)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:15px}

.ic-chuva{background:var(--rain-soft);color:var(--rain)}
.ic-leite{background:var(--surface-2);color:var(--fg)}
.ic-gasto{background:var(--red-soft);color:var(--red)}
.ic-venda{background:var(--good-soft);color:var(--good)}
.ic-plantio,.ic-colheita{background:var(--gold-soft);color:var(--gold-ink)}
.ic-anotacao{background:var(--surface-2);color:var(--muted)}
.ic-vaca{background:var(--surface-2);color:var(--fg)}
.ic-boi{background:var(--red-soft);color:var(--red)}

/* Alertas */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-left-width:5px}
.alert.warn{border-left-color:var(--warn)}
.alert.info{border-left-color:var(--rain)}
.alert.red{border-left-color:var(--red)}
.alert .when{font-size:13px;color:var(--muted)}
.alert .tx{flex:1;min-width:0}
.alert b{display:block}

/* Grade de lançamentos */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-height:98px}
.tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.tile .ic svg{width:24px;height:24px}
.tile b{font-size:17px}
.tile span{font-size:13px;color:var(--muted);margin-top:-6px}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--black);color:#fff;border-color:var(--black)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--gold);color:#1a1311;border-color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--gold);color:#1a1311;border-color:var(--gold)}}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.gray{background:var(--surface-2);color:var(--muted)}
.row .tx .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;white-space:normal;overflow:visible}
.row .tx .pills .pill{display:inline-block;font-size:12px;font-weight:700}
.row .tx .pills .pill.good{color:var(--good)} .row .tx .pills .pill.warn{color:var(--warn)} .row .tx .pills .pill.red{color:var(--red)}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-size:16px}
.btn.primary{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.btn.gold{background:var(--gold);color:#1a1311;border-color:var(--gold)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}

/* Formulário */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
.field .hint{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{min-height:52px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 14px;font-size:18px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline > *{min-width:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{border:0;background:none;border-radius:9px;min-height:44px;font-weight:700;cursor:pointer;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15);color:var(--red)}

/* Folha (modal) */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(10,6,5,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;
  padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-h h2{font-size:21px;font-weight:800}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:20px}}

/* Guias */
.article{display:flex;flex-direction:column;gap:12px;font-size:17px}
.article h3{font-size:18px;margin-top:6px}
.article p{margin:0}
.article ul,.article ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.article .tip{background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:12px 14px;font-size:15px}
.article .caution{background:var(--red-soft);color:var(--fg);border-radius:12px;padding:12px 14px;font-size:15px;border-left:4px solid var(--red)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--surface)}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}

.result{background:var(--surface);border:2px solid var(--gold);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.result .big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--black);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.3);max-width:calc(100% - 32px)}

@media (max-width:380px){
  .stat .v{font-size:22px}
  .bar-row{grid-template-columns:80px 1fr}
}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#b3201b"/><path d="M32 54V22" stroke="#1a1311" stroke-width="4" stroke-linecap="round"/><g fill="#e9b23c"><ellipse cx="26" cy="20" rx="5" ry="7"/><ellipse cx="38" cy="20" rx="5" ry="7"/><ellipse cx="26" cy="32" rx="5" ry="7"/><ellipse cx="38" cy="32" rx="5" ry="7"/><ellipse cx="32" cy="11" rx="4.5" ry="6.5"/></g><path d="M32 44c-6-1-11-5-13-10 6 0 11 3 13 8 2-5 7-8 13-8-2 5-7 9-13 10z" fill="#1a1311"/></svg>
      <div style="min-width:0"><b>Caderno da Roça</b><small id="who">Seu caderno de campo</small></div>
    </div>
    <div class="spacer"></div>
  </div>
  <div class="top-stripe"></div>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="Seções">
  <div class="tabs-in">
    <button class="tab" data-tab="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Início</button>
    <button class="tab" data-tab="caderno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2z"/><path d="M5 19a2 2 0 0 1 2-2h12"/><path d="M9 7h6M9 11h6"/></svg>Caderno</button>
    <button class="tab plus" data-tab="anotar" aria-label="Anotar"><span class="bubble"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Anotar</button>
    <button class="tab" data-tab="rebanho"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c1 2 3 3 5 3h6c2 0 4-1 5-3"/><path d="M7 9c-1 1-1 3-1 5 0 3 2 6 6 6s6-3 6-6c0-2 0-4-1-5"/><circle cx="10" cy="13" r=".8" fill="currentColor"/><circle cx="14" cy="13" r=".8" fill="currentColor"/><path d="M10 17h4"/></svg>Rebanho</button>
    <button class="tab" data-tab="guias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c0-6 0-10 0-14"/><path d="M12 12c-4 0-7-3-7-7 4 0 7 3 7 7z"/><path d="M12 9c3 0 6-2 6-6-3 0-6 2-6 6z"/><path d="M8 21h8"/></svg>Guias</button>
  </div>
</nav>

<div id="sheetWrap" class="sheet-wrap" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
'use strict';
/* =========================================================
   Caderno da Roça — app do produtor rural (funciona offline)
   Os dados ficam guardados no próprio celular (localStorage).
   ========================================================= */

const KEY = 'caderno-da-roca-v1';
const ATIV = {
  leite:{nome:'Leite', cor:'var(--fg)'},
  corte:{nome:'Gado de corte', curto:'Corte', cor:'var(--red)'},
  graos:{nome:'Grãos', cor:'var(--gold)'},
  horta:{nome:'Horta', cor:'var(--good)'},
  geral:{nome:'Geral', cor:'var(--muted)'}
};
const ICONS = {
  chuva:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 15a4 4 0 0 1-.5-8 6 6 0 0 1 11.3 1.5A3.5 3.5 0 0 1 17.5 15z"/><path d="M8 18l-1 2M12 18l-1 2M16 18l-1 2"/></svg>',
  leite:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 2h6v3l2 3v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V8l2-3z"/><path d="M7 12h10"/></svg>',
  gasto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>',
  venda:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  plantio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-8"/><path d="M12 12c-3 0-5-2-5-5 3 0 5 2 5 5zM12 12c0-3 2-5 5-5 0 3-2 5-5 5z"/><path d="M4 20h16"/></svg>',
  colheita:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 22V9"/><ellipse cx="9.5" cy="8" rx="2" ry="3"/><ellipse cx="14.5" cy="8" rx="2" ry="3"/><ellipse cx="9.5" cy="14" rx="2" ry="3"/><ellipse cx="14.5" cy="14" rx="2" ry="3"/><ellipse cx="12" cy="3.5" rx="1.8" ry="2.5"/></svg>',
  anotacao:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>',
  vaca:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c1 2 3 3 5 3h6c2 0 4-1 5-3"/><path d="M7 9c-1 1-1 3-1 5 0 3 2 6 6 6s6-3 6-6c0-2 0-4-1-5"/><path d="M10 17h4"/></svg>',
  boi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5c0 3 2 4 5 4h8c3 0 5-1 5-4"/><path d="M7 9c-1 1-1 3-1 5 0 3 2 6 6 6s6-3 6-6c0-2 0-4-1-5"/><path d="M10 17h4"/></svg>',
  balanca:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9a5 5 0 0 1 8 0"/><path d="M12 9l2-2"/></svg>',
  sino:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>',
  prev:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  close:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const TIPOS = {
  chuva:{nome:'Chuva', desc:'Milímetros do pluviômetro'},
  leite:{nome:'Leite', desc:'Litros tirados no dia'},
  gasto:{nome:'Gasto', desc:'Ração, remédio, diária…'},
  venda:{nome:'Venda', desc:'Leite, animal, safra…'},
  plantio:{nome:'Plantio', desc:'O que e quanto plantou'},
  colheita:{nome:'Colheita', desc:'Quanto colheu'},
  anotacao:{nome:'Anotação', desc:'Serviço feito, observação'}
};
const CULTURAS = ['Milho','Feijão-de-corda','Feijão','Sorgo','Mandioca','Palma','Capim','Coentro','Alface','Cebolinha','Couve','Tomate','Pimentão','Quiabo','Jerimum','Melancia','Outra'];
const GESTACAO = 283, SECAGEM = 60, CICLO_CIO = 21;

/* ---------- utilidades ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje = () => iso(new Date());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDias = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDias = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES_C = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const fData = s => { const d = parse(s); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };
const fDataC = s => { const d = parse(s); return `${d.getDate()} ${MES_C[d.getMonth()]}`; };
const fNum = (n, dec=0) => Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:dec, maximumFractionDigits:dec});
const fR = n => (n < 0 ? '−' : '') + 'R$ ' + Math.abs(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
const fRc = n => { const a=Math.abs(n||0); const s = a>=10000 ? fNum(a/1000,1)+' mil' : fNum(a,0); return (n<0?'−':'')+'R$ '+s; };
const num = v => { if (v === '' || v == null) return NaN; return Number(String(v).replace(/\./g,'').replace(',','.')); };
const numDec = v => { if (v === '' || v == null) return NaN; const s=String(v).trim(); return Number(s.includes(',') ? s.replace(/\./g,'').replace(',','.') : s); };
const quando = s => { const d = diffDias(hoje(), s); if (d===0) return 'hoje'; if (d===1) return 'amanhã'; if (d===-1) return 'ontem'; if (d>1) return `em ${d} dias`; return `há ${-d} dias`; };

/* ---------- dados ---------- */
let S = load();
function vazio(){ return {versao:1, nome:'', registros:[], animais:[], lembretes:[], exemplo:false, inicioVisto:false}; }
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); return Object.assign(vazio(), d); } } catch(e){}
  return vazio();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Não consegui guardar no celular. Faça uma cópia de segurança.'); }
}

/* ---------- estado da tela ---------- */
const ui = { tab:'inicio', mes: hoje().slice(0,7), filtro:'todos', reb:'todos', guia:null, guiaFiltro:'todos' };

/* ---------- navegação ---------- */
$$('.tab').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.tab === 'anotar') { abrirEscolhaRegistro(); return; }
  irPara(b.dataset.tab);
}));
function irPara(tab){ ui.tab = tab; if (tab!=='guias') ui.guia=null; render(); window.scrollTo(0,0); }
function render(){
  const atual = ui.tab === 'mais' ? 'guias' : ui.tab;
  $$('.tab').forEach(b => { if (b.dataset.tab === atual) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  $('#who').textContent = S.nome ? S.nome : 'Seu caderno de campo';
  const v = $('#view');
  if (!S.inicioVisto && !S.registros.length && !S.animais.length) { v.innerHTML = telaBoasVindas(); ligarBoasVindas(); return; }
  const fn = {inicio:telaInicio, caderno:telaCaderno, rebanho:telaRebanho, guias:telaGuias, mais:telaMais}[ui.tab] || telaInicio;
  v.innerHTML = (S.exemplo ? bannerExemplo() : '') + fn();
  ligar(v);
}

/* ---------- boas-vindas ---------- */
function telaBoasVindas(){
  return `
  <section class="section" style="gap:16px">
    <p class="eyebrow">Bem-vindo</p>
    <h1 style="font-family:var(--font-display);font-size:30px">Anote a roça.<br>Veja o que dá lucro.</h1>
    <p>Marque a chuva, o leite, os gastos e as vendas. O app soma tudo, mostra o resultado de cada atividade e avisa de parto, secagem e cio.</p>
    <div class="field"><label for="nomeIni">Seu nome ou nome do sítio (opcional)</label><input id="nomeIni" placeholder="Ex.: Sítio Boa Vista" autocomplete="off"></div>
    <div class="btn-row">
      <button class="btn primary" data-act="comecar">Começar do zero</button>
      <button class="btn" data-act="exemplo">Ver com exemplo</button>
    </div>
    <p class="small muted">Os dados ficam guardados só neste celular. Funciona sem internet depois de aberto a primeira vez.</p>
  </section>`;
}
function ligarBoasVindas(){
  $('[data-act="comecar"]').onclick = () => { S.nome = $('#nomeIni').value.trim(); S.inicioVisto = true; save(); render(); };
  $('[data-act="exemplo"]').onclick = () => { S.nome = $('#nomeIni').value.trim(); S.inicioVisto = true; carregarExemplo(); save(); render(); };
}
function bannerExemplo(){
  return `<div class="banner"><b>Você está vendo dados de exemplo.</b><span>Quando quiser usar de verdade, apague os exemplos. O que você mesmo anotou continua.</span><button class="btn sm gold" data-act="apagarEx">Apagar exemplos</button></div>`;
}

/* ---------- cálculos ---------- */
const doMes = (m) => S.registros.filter(r => r.data.slice(0,7) === m);
const doAno = (a) => S.registros.filter(r => r.data.slice(0,4) === a);
function resumoMes(m){
  const rs = doMes(m);
  const chuva = rs.filter(r=>r.tipo==='chuva').reduce((s,r)=>s+(r.mm||0),0);
  const diasChuva = new Set(rs.filter(r=>r.tipo==='chuva' && r.mm>0).map(r=>r.data)).size;
  const leiteRs = rs.filter(r=>r.tipo==='leite');
  const leite = leiteRs.reduce((s,r)=>s+(r.litros||0),0);
  const diasLeite = new Set(leiteRs.map(r=>r.data)).size;
  const porAtiv = {};
  Object.keys(ATIV).forEach(k => porAtiv[k] = {ent:0, sai:0});
  rs.forEach(r => {
    if (r.tipo==='venda') porAtiv[r.ativ||'geral'].ent += r.valor||0;
    if (r.tipo==='gasto') porAtiv[r.ativ||'geral'].sai += r.valor||0;
  });
  const ent = Object.values(porAtiv).reduce((s,a)=>s+a.ent,0);
  const sai = Object.values(porAtiv).reduce((s,a)=>s+a.sai,0);
  return {chuva, diasChuva, leite, diasLeite, porAtiv, ent, sai, saldo: ent-sai};
}
function custoLitro(m){
  const r = resumoMes(m);
  const gastoLeite = r.porAtiv.leite.sai;
  const vendasLeite = doMes(m).filter(x=>x.tipo==='venda' && x.ativ==='leite');
  const litrosVend = vendasLeite.reduce((s,x)=>s+((x.unidade==='litros'&&x.qtd)||0),0);
  const valVend = vendasLeite.filter(x=>x.unidade==='litros'&&x.qtd).reduce((s,x)=>s+(x.valor||0),0);
  return {
    custo: r.leite ? gastoLeite / r.leite : null,
    preco: litrosVend ? valVend / litrosVend : null,
    litros: r.leite
  };
}

/* ---------- alertas do rebanho ---------- */
function situacao(a){
  // devolve estado reprodutivo de uma vaca
  const out = {};
  if (a.cobertura && (!a.ultParto || a.cobertura > a.ultParto)) {
    out.prenha = true;
    out.parto = addDias(a.cobertura, GESTACAO);
    out.secar = addDias(out.parto, -SECAGEM);
  }
  if (!out.prenha && a.ultCio) {
    let p = addDias(a.ultCio, CICLO_CIO);
    while (diffDias(hoje(), p) < -3) p = addDias(p, CICLO_CIO); // projeta o próximo ciclo
    out.proxCio = p;
  }
  if (a.ultParto) out.diasParida = diffDias(a.ultParto, hoje());
  return out;
}
function alertas(){
  const h = hoje(), lista = [];
  S.animais.forEach(a => {
    if (a.tipo !== 'leite') return;
    const s = situacao(a);
    if (s.prenha) {
      const dp = diffDias(h, s.parto), ds = diffDias(h, s.secar);
      if (dp >= -5 && dp <= 30) lista.push({data:s.parto, nivel:'red', t:`Parto previsto de ${a.nome}`, d:`${fData(s.parto)} · ${quando(s.parto)}`, id:a.id});
      else if (ds >= -10 && ds <= 15) lista.push({data:s.secar, nivel:'warn', t:`Secar ${a.nome}`, d:`${fData(s.secar)} · ${quando(s.secar)} · 60 dias antes do parto`, id:a.id});
    }
    if (s.proxCio) {
      const dc = diffDias(h, s.proxCio);
      if (dc >= -2 && dc <= 5) lista.push({data:s.proxCio, nivel:'info', t:`Observar cio de ${a.nome}`, d:`${fData(s.proxCio)} · ${quando(s.proxCio)}`, id:a.id});
    }
    if (!s.prenha && s.diasParida != null && s.diasParida > 90) lista.push({data:h, nivel:'warn', t:`${a.nome} vazia há ${s.diasParida} dias após o parto`, d:'Converse com o veterinário sobre a reprodução', id:a.id});
  });
  S.lembretes.filter(l => !l.feito).forEach(l => {
    const d = diffDias(h, l.data);
    if (d <= 15) lista.push({data:l.data, nivel: d < 0 ? 'red' : 'info', t:l.texto, d:`${fData(l.data)} · ${quando(l.data)}`, lembrete:l.id});
  });
  return lista.sort((a,b)=>a.data<b.data?-1:1);
}

/* ---------- INÍCIO ---------- */
function telaInicio(){
  const m = ui.mes, [y,mm] = m.split('-').map(Number);
  const r = resumoMes(m), cl = custoLitro(m);
  const ehAtual = m === hoje().slice(0,7);
  const al = alertas();
  const ano = String(y);
  const chuvaAno = doAno(ano).filter(x=>x.tipo==='chuva').reduce((s,x)=>s+(x.mm||0),0);
  const diasNoMes = ehAtual ? new Date().getDate() : new Date(y, mm, 0).getDate();
  const mediaLeite = r.diasLeite ? r.leite / r.diasLeite : 0;

  const ativs = Object.keys(ATIV).filter(k => r.porAtiv[k].ent || r.porAtiv[k].sai);
  const maxAbs = Math.max(1, ...ativs.map(k => Math.max(r.porAtiv[k].ent, r.porAtiv[k].sai)));

  return `
  <div class="monthnav">
    <button class="iconbtn" data-act="mesAnt" aria-label="Mês anterior">${ICONS.prev}</button>
    <div style="text-align:center"><p class="eyebrow">${ehAtual ? 'Este mês' : 'Resumo do mês'}</p><h1>${MESES[mm-1]} ${y}</h1></div>
    <button class="iconbtn" data-act="mesProx" aria-label="Próximo mês" ${ehAtual?'disabled':''}>${ICONS.next}</button>
  </div>

  ${al.length ? `<section class="section"><div class="section-h"><h2>Avisos</h2><span class="muted small">${al.length}</span></div>
    <div class="alerts">${al.slice(0,5).map(a => `
      <div class="alert ${a.nivel}">
        <div class="tx"><b>${esc(a.t)}</b><span class="when">${esc(a.d)}</span></div>
        ${a.lembrete ? `<button class="btn sm" data-act="lembFeito" data-id="${a.lembrete}">Feito</button>` : `<button class="btn sm" data-act="verAnimal" data-id="${a.id}">Ver</button>`}
      </div>`).join('')}
    </div></section>` : ''}

  <div class="stats">
    <div class="stat money ${r.saldo>=0?'pos':'neg'}" style="grid-column:1/-1">
      <span class="k">Resultado do mês (vendas − gastos)</span>
      <span class="v">${fR(r.saldo)}</span>
      <span class="s num">Entrou ${fR(r.ent)} · Saiu ${fR(r.sai)}</span>
    </div>
    <div class="stat rain"><span class="k">Chuva no mês</span><span class="v">${fNum(r.chuva)} <small>mm</small></span><span class="s">${r.diasChuva} dia${r.diasChuva===1?'':'s'} com chuva · ${fNum(chuvaAno)} mm no ano</span></div>
    <div class="stat"><span class="k">Leite no mês</span><span class="v">${fNum(r.leite)} <small>L</small></span><span class="s">${r.diasLeite ? `média ${fNum(mediaLeite)} L por dia` : 'nenhum dia anotado'}</span></div>
  </div>

  ${cl.custo != null ? `
  <section class="section">
    <div class="section-h"><h2>Custo do litro de leite</h2></div>
    <div class="card" style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <div><span class="muted small">Custa produzir</span><div style="font-size:24px;font-weight:800" class="num">${fR(cl.custo)}</div></div>
        <div style="text-align:right"><span class="muted small">Preço recebido</span><div style="font-size:24px;font-weight:800" class="num">${cl.preco!=null?fR(cl.preco):'—'}</div></div>
      </div>
      ${cl.preco!=null ? (cl.preco >= cl.custo
        ? `<span class="pill good">Sobra ${fR(cl.preco-cl.custo)} por litro</span>`
        : `<span class="pill red">Falta ${fR(cl.custo-cl.preco)} por litro: o leite está dando prejuízo</span>`)
        : `<span class="small muted">Anote vendas de leite em litros para comparar com o preço.</span>`}
      <span class="small muted">Gastos do leite no mês divididos pelos litros anotados.</span>
    </div>
  </section>` : ''}

  <section class="section">
    <div class="section-h"><h2>Resultado por atividade</h2></div>
    <div class="card">
      ${ativs.length ? `<div class="bars">${ativs.map(k => {
        const a = r.porAtiv[k], s = a.ent - a.sai;
        const w = Math.max(4, Math.abs(s)/maxAbs*100);
        return `<div class="bar-row">
          <span class="lbl">${ATIV[k].curto||ATIV[k].nome}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${s>=0?'var(--good-soft)':'var(--red-soft)'};border-right:4px solid ${s>=0?'var(--good)':'var(--bad)'}"></div><span class="bar-val" style="color:${s>=0?'var(--good)':'var(--bad)'}">${fR(s)}</span></div>
          <span class="bar-sub num">vendeu ${fRc(a.ent)} · gastou ${fRc(a.sai)}</span>
        </div>`;}).join('')}</div>`
      : `<p class="empty">Anote gastos e vendas e escolha a atividade de cada um. Aqui aparece quanto cada uma está dando.</p>`}
    </div>
  </section>

  <section class="section">
    <div class="section-h"><h2>Chuva em ${y}</h2><span class="muted small num">${fNum(chuvaAno)} mm</span></div>
    <div class="card">${graficoChuva(ano)}</div>
  </section>

  <section class="section">
    <div class="section-h"><h2>Últimas anotações</h2><button class="link" data-act="irCaderno">Ver todas</button></div>
    ${listaRegistros([...S.registros].sort(ordem).slice(0,5))}
  </section>`;
}
const ordem = (a,b) => a.data < b.data ? 1 : a.data > b.data ? -1 : (b.criado||0) - (a.criado||0);

function graficoChuva(ano){
  const tot = Array(12).fill(0);
  doAno(ano).filter(r=>r.tipo==='chuva').forEach(r => tot[Number(r.data.slice(5,7))-1] += r.mm||0);
  const max = Math.max(...tot);
  if (!max) return `<p class="empty">Nenhuma chuva anotada em ${ano}.</p>`;
  const top = Math.max(50, Math.ceil(max/50)*50);
  const W=340, H=180, L=34, B=26, T=16, cw=(W-L-6)/12;
  const y = v => T + (H-T-B) * (1 - v/top);
  const ticks = [0, top/2, top];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chuva por mês em ${ano}">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fNum(t)}</text>`).join('')}
    ${tot.map((v,i)=>{
      const x = L + i*cw + cw*0.18, w = cw*0.64, yy = y(v), h = (H-B) - yy;
      return `${v?`<rect x="${x}" y="${yy}" width="${w}" height="${Math.max(h,1)}" rx="3" fill="var(--rain)"/>`:''}
      ${v && v===max ? `<text x="${x+w/2}" y="${yy-4}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--rain)">${fNum(v)}</text>`:''}
      <text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${MES_C[i][0].toUpperCase()}</text>`;
    }).join('')}
  </svg><p class="small muted" style="margin:6px 0 0">Milímetros por mês. Compare a quadra chuvosa de um ano com a do outro.</p>`;
}

/* ---------- lista de registros ---------- */
function descRegistro(r){
  const a = ATIV[r.ativ] ? ATIV[r.ativ].nome : '';
  switch(r.tipo){
    case 'chuva': return {t:'Chuva', s:fData(r.data), v:`${fNum(r.mm,r.mm%1?1:0)} mm`, c:'rain'};
    case 'leite': { const an = S.animais.find(x=>x.id===r.animal); return {t:'Leite' + (an?` · ${an.nome}`:''), s:fData(r.data), v:`${fNum(r.litros,r.litros%1?1:0)} L`, c:''}; }
    case 'gasto': return {t:r.desc||'Gasto', s:`${fData(r.data)} · ${a}`, v:'−'+fR(r.valor).replace('R$ ','R$ '), c:'neg'};
    case 'venda': return {t:r.desc||'Venda', s:`${fData(r.data)} · ${a}${r.qtd?` · ${fNum(r.qtd, r.qtd%1?1:0)} ${r.unidade||''}`:''}`, v:fR(r.valor), c:'pos'};
    case 'plantio': return {t:`Plantio de ${r.cultura}`, s:`${fData(r.data)}${r.area?` · ${fNum(r.area, r.area%1?1:0)} ${r.unidade}`:''}`, v:'', c:''};
    case 'colheita': return {t:`Colheita de ${r.cultura}`, s:fData(r.data), v:r.qtd?`${fNum(r.qtd, r.qtd%1?1:0)} ${r.unidade}`:'', c:''};
    default: return {t:r.desc||'Anotação', s:`${fData(r.data)}${a?' · '+a:''}`, v:'', c:''};
  }
}
function listaRegistros(rs){
  if (!rs.length) return `<div class="list"><p class="empty">Nada anotado ainda. Toque no botão <b>+</b> embaixo para começar.</p></div>`;
  return `<div class="list">${rs.map(r => { const d = descRegistro(r); return `
    <button class="row" data-act="editReg" data-id="${r.id}">
      <span class="ic ic-${r.tipo}">${ICONS[r.tipo]}</span>
      <span class="tx"><b>${esc(d.t)}</b><span>${esc(d.s)}</span></span>
      ${d.v?`<span class="amt ${d.c}">${esc(d.v)}</span>`:''}
    </button>`;}).join('')}</div>`;
}

/* ---------- CADERNO ---------- */
function telaCaderno(){
  const filtros = [['todos','Tudo'],['chuva','Chuva'],['leite','Leite'],['dinheiro','Gastos e vendas'],['lavoura','Plantio e colheita'],['anotacao','Anotações']];
  let rs = [...S.registros].sort(ordem);
  const f = ui.filtro;
  if (f==='dinheiro') rs = rs.filter(r=>r.tipo==='gasto'||r.tipo==='venda');
  else if (f==='lavoura') rs = rs.filter(r=>r.tipo==='plantio'||r.tipo==='colheita');
  else if (f!=='todos') rs = rs.filter(r=>r.tipo===f);
  // agrupa por mês
  const grupos = {};
  rs.forEach(r => (grupos[r.data.slice(0,7)] ||= []).push(r));
  const meses = Object.keys(grupos).sort().reverse();
  return `
  <div class="section-h"><h1 style="font-size:26px;font-family:var(--font-display)">Caderno</h1><span class="muted small">${S.registros.length} anotações</span></div>
  <div class="chips" role="group" aria-label="Filtrar">${filtros.map(([k,n])=>`<button class="chip" data-act="filtro" data-f="${k}" aria-pressed="${f===k}">${n}</button>`).join('')}</div>
  ${meses.length ? meses.map(m => { const [y,mm]=m.split('-').map(Number); return `
    <section class="section"><div class="section-h"><p class="eyebrow">${MESES[mm-1]} ${y}</p>${resumoGrupo(grupos[m], f)}</div>${listaRegistros(grupos[m].slice(0,200))}</section>`; }).join('')
  : listaRegistros([])}
  `;
}
function resumoGrupo(rs, f){
  if (f==='chuva') return `<span class="small muted num">${fNum(rs.reduce((s,r)=>s+(r.mm||0),0))} mm</span>`;
  if (f==='leite') return `<span class="small muted num">${fNum(rs.reduce((s,r)=>s+(r.litros||0),0))} L</span>`;
  if (f==='dinheiro') { const s = rs.reduce((s,r)=>s+(r.tipo==='venda'?r.valor:-r.valor),0); return `<span class="small num" style="color:${s>=0?'var(--good)':'var(--bad)'};font-weight:700">${fR(s)}</span>`; }
  return '';
}

function formRegistro(tipo, reg){

    <div class="field"><label for="fValor">Valor (R$)</label><input id="fValor" inputmode="decimal" value="${v(r.valor)}" placeholder="0,00" required></div>`;
  if (tipo==='venda') campos += `${selAtiv('fAtiv', r.ativ)}
    <div class="field"><label for="fDesc">O que vendeu?</label><input id="fDesc" value="${esc(r.desc||'')}" placeholder="Ex.: leite para o laticínio" list="sugVenda"></div>
    <datalist id="sugVenda">${['Leite','Queijo','Bezerro','Garrote','Vaca','Boi','Milho','Feijão','Verduras','Coentro','Ovos'].map(x=>`<option value="${x}">`).join('')}</datalist>
    <div class="inline"><div class="field"><label for="fQtd">Quantidade</label><input id="fQtd" inputmode="decimal" value="${v(r.qtd)}" placeholder="Opcional"></div>
    <div class="field"><label for="fUn">Unidade</label><select id="fUn">${['litros','cabeças','sacos','kg','arrobas','maços','caixas','unidades'].map(u=>`<option ${r.unidade===u?'selected':''}>${u}</option>`).join('')}</select></div></div>
    <span class="hint muted small" style="margin-top:-8px">Venda de leite em <b>litros</b> serve para o app calcular o preço do litro.</span>
    <div class="field"><label for="fValor">Valor total (R$)</label><input id="fValor" inputmode="decimal" value="${v(r.valor)}" placeholder="0,00" required></div>`;
  if (tipo==='plantio') campos += `<div class="field"><label for="fCult">Cultura</label><select id="fCult">${CULTURAS.map(c=>`<option ${r.cultura===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="inline"><div class="field"><label for="fArea">Área</label><input id="fArea" inputmode="decimal" value="${v(r.area)}" placeholder="Ex.: 2"></div>
    <div class="field"><label for="fUn">Medida</label><select id="fUn">${['tarefas','hectares','canteiros','covas','linhas'].map(u=>`<option ${r.unidade===u?'selected':''}>${u}</option>`).join('')}</select></div></div>

        if (tipo==='leite'){ novo.litros = numDec(g('fLitros')); novo.animal = g('fVaca')||''; novo.ativ='leite'; if (!(novo.litros>0)) return erro('Escreva quantos litros.'); }
        if (tipo==='gasto'||tipo==='venda'){ novo.ativ=g('fAtiv'); novo.desc=g('fDesc'); novo.valor=numDec(g('fValor')); if (!(novo.valor>0)) return erro('Escreva o valor em reais.'); }
        if (tipo==='venda'){ const q=numDec(g('fQtd')); novo.qtd = q>0?q:null; novo.unidade=g('fUn'); }
        if (tipo==='plantio'){ novo.cultura=g('fCult'); const a=numDec(g('fArea')); novo.area=a>0?a:null; novo.unidade=g('fUn'); novo.desc=g('fDesc'); novo.ativ = ['Coentro','Alface','Cebolinha','Couve','Tomate','Pimentão','Quiabo'].includes(novo.cultura)?'horta':'graos'; }
        if (tipo==='colheita'){ novo.cultura=g('fCult'); novo.qtd=numDec(g('fQtd')); novo.unidade=g('fUn'); novo.desc=g('fDesc'); if (!(novo.qtd>0)) return erro('Escreva quanto colheu.'); novo.ativ = ['Coentro','Alface','Cebolinha','Couve','Tomate','Pimentão','Quiabo'].includes(novo.cultura)?'horta':'graos'; }
        if (tipo==='anotacao'){ novo.ativ=g('fAtiv'); novo.desc=g('fDesc'); if (!novo.desc) return erro('Escreva a anotação.'); }
        if (reg) { delete novo.ex; S.registros = S.registros.map(x => x.id===reg.id ? novo : x); }
        else { novo.id = uid(); novo.criado = Date.now(); S.registros.push(novo); }
        save(); fecharFolha(); render(); toast(reg ? 'Alteração salva' : `${TIPOS[tipo].nome} anotada`);
      };
      const del = $('[data-act="del"]', form);
      if (del) confirmar(del, () => { S.registros = S.registros.filter(x=>x.id!==reg.id); save(); fecharFolha(); render(); toast('Anotação apagada'); });
    });
}
function ultimaAtiv(tipo){ const r = [...S.registros].sort(ordem).find(x=>x.tipo===tipo); return r && r.ativ; }
function confirmar(btn, fn){
  let armado = false, t;
  const txt = btn.textContent;
  btn.onclick = () => {
    if (armado) { clearTimeout(t); fn(); return; }
    armado = true; btn.textContent = 'Toque de novo para confirmar'; btn.classList.add('primary'); btn.classList.remove('danger');
    t = setTimeout(()=>{ armado=false; btn.textContent=txt; btn.classList.remove('primary'); btn.classList.add('danger'); }, 4000);
  };
}

function telaRebanho(){
  const f = ui.reb;
  let as = S.animais.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{numeric:true}));
  if (f!=='todos') as = as.filter(a=>a.tipo===f);
  const nL = S.animais.filter(a=>a.tipo==='leite').length, nC = S.animais.filter(a=>a.tipo==='corte').length;
  const prenhas = S.animais.filter(a=>a.tipo==='leite' && situacao(a).prenha).length;
  return `
  <div class="section-h"><h1 style="font-size:26px;font-family:var(--font-display)">Rebanho</h1><button class="btn sm primary" data-act="novoAnimal">+ Animal</button></div>
  <div class="stats">
    <div class="stat"><span class="k">Gado de leite</span><span class="v">${nL}</span><span class="s">${prenhas} prenha${prenhas===1?'':'s'}</span></div>
    <div class="stat"><span class="k">Gado de corte</span><span class="v">${nC}</span><span class="s">${pesoMedioCorte()}</span></div>
  </div>
  <div class="chips">${[['todos','Todos'],['leite','Leite'],['corte','Corte']].map(([k,n])=>`<button class="chip" data-act="rebF" data-f="${k}" aria-pressed="${f===k}">${n}</button>`).join('')}</div>
  ${as.length ? `<div class="list">${as.map(a => cardAnimal(a)).join('')}</div>`
   : `<div class="list"><p class="empty">Cadastre suas vacas e bois para o app avisar de cio, parto e secagem, e acompanhar o ganho de peso.</p></div>`}
  <div class="card small muted">Datas de parto: ${GESTACAO} dias após a cobertura ou inseminação. Secagem: ${SECAGEM} dias antes do parto. Cio: a cada ${CICLO_CIO} dias. São médias, confirme a prenhez com o veterinário.</div>
  `;
}
function pesoMedioCorte(){
  const ps = S.animais.filter(a=>a.tipo==='corte' && a.pesagens && a.pesagens.length).map(a=>a.pesagens.slice().sort((x,y)=>x.data<y.data?-1:1).at(-1).peso);
  if (!ps.length) return 'sem pesagem';
  return `peso médio ${fNum(ps.reduce((s,p)=>s+p,0)/ps.length)} kg`;
}
function gmd(a){
  const p = (a.pesagens||[]).slice().sort((x,y)=>x.data<y.data?-1:1);
  if (p.length < 2) return null;
  const u = p.at(-1), pen = p.at(-2), pr = p[0];
  const dU = diffDias(pen.data, u.data), dT = diffDias(pr.data, u.data);
  return { ultimo: dU>0 ? (u.peso-pen.peso)/dU : null, total: dT>0 ? (u.peso-pr.peso)/dT : null, peso:u.peso, data:u.data, dias:dU };
}
function cardAnimal(a){
  const pills = [];
  let sub = a.raca ? esc(a.raca) : (a.tipo==='leite'?'Gado de leite':'Gado de corte');
  if (a.tipo==='leite'){
    const s = situacao(a);
    if (s.prenha) {
      pills.push(`<span class="pill good">Prenha · parto ${fDataC(s.parto)}</span>`);
      const ds = diffDias(hoje(), s.secar);
      if (ds > 0 && ds <= 15) pills.push(`<span class="pill warn">Secar ${quando(s.secar)}</span>`);
      else if (ds <= 0 && diffDias(hoje(), s.parto) > 0) pills.push(`<span class="pill gray">Período seco desde ${fDataC(s.secar)}</span>`);
    }
    else if (s.proxCio) pills.push(`<span class="pill gray">Cio previsto ${fDataC(s.proxCio)}</span>`);
    if (!s.prenha && s.diasParida != null) pills.push(`<span class="pill ${s.diasParida>90?'warn':'gray'}">Parida há ${s.diasParida} dias</span>`);
    const lt = S.registros.filter(r=>r.tipo==='leite' && r.animal===a.id).sort(ordem)[0];
    if (lt) sub += ` · último leite ${fNum(lt.litros,lt.litros%1?1:0)} L`;
  } else {
    const g = gmd(a);
    const p = (a.pesagens||[]).slice().sort((x,y)=>x.data<y.data?-1:1).at(-1);
    if (p) sub += ` · ${fNum(p.peso)} kg em ${fDataC(p.data)}`;
    if (g && g.ultimo!=null) pills.push(`<span class="pill ${g.ultimo>=0.5?'good':g.ultimo>0?'warn':'red'}">Ganho ${fNum(g.ultimo*1000)} g/dia</span>`);
    else pills.push(`<span class="pill gray">Pese de novo para ver o ganho</span>`);
  }
  return `<button class="row" data-act="verAnimal" data-id="${a.id}">
    <span class="ic ic-${a.tipo==='leite'?'vaca':'boi'}">${ICONS[a.tipo==='leite'?'vaca':'boi']}</span>
    <span class="tx"><b>${esc(a.nome)}</b><span>${sub}</span>${pills.length?`<span class="pills">${pills.join('')}</span>`:''}</span>
  </button>`;
}
function formAnimal(a){
  const x = a || {tipo: ui.reb==='corte'?'corte':'leite', nome:'', raca:''};
  abrirFolha(a?'Editar animal':'Novo animal', `

      <div class="field" id="anPesoF" ${x.tipo==='corte'&&!a?'':'hidden'}><label for="anPeso">Peso de entrada em kg (opcional)</label><input id="anPeso" inputmode="decimal" placeholder="Ex.: 210"></div>
      <p class="small" id="anErro" style="color:var(--bad);margin:0" hidden></p>
      <button class="btn primary block" type="submit">${a?'Salvar':'Cadastrar'}</button>
      ${a?`<button class="btn danger block" type="button" data-act="del">Tirar do rebanho</button>`:''}
    </form>`, f => {
      let tipo = x.tipo;
      $$('#anTipo button', f).forEach(b => b.onclick = () => { tipo=b.dataset.v; $$('#anTipo button', f).forEach(y=>y.setAttribute('aria-pressed', y===b)); if(!a) $('#anPesoF',f).hidden = tipo!=='corte'; });
      $('#fAn', f).onsubmit = e => {

        const nome = $('#anNome',f).value.trim();

        if (a) { S.animais = S.animais.map(y => y.id===a.id ? {...y, nome, raca:$('#anRaca',f).value.trim(), tipo} : y); }
        else {
          const novo = {id:uid(), nome, raca:$('#anRaca',f).value.trim(), tipo, pesagens:[]};

  } else {

    corpo = `

      <div class="stat"><span class="k">Ganho desde a 1ª pesagem</span><span class="v">${g.total!=null?fNum(g.total*1000):'—'} <small>g/dia</small></span><span class="s">${fNum(p[0].peso)} → ${fNum(g.peso)} kg</span></div>
    </div>` : ''}
    ${p.length>=2 ? graficoPeso(p) : ''}
    <form class="form card" id="fPeso" novalidate>
      <b>Nova pesagem</b>
      <div class="inline"><div class="field"><label for="pData">Data</label><input id="pData" type="date" value="${hoje()}"></div>
      <div class="field"><label for="pKg">Peso (kg)</label><input id="pKg" inputmode="decimal" placeholder="Ex.: 285"></div></div>
      <button class="btn primary" type="submit">Anotar pesagem</button>
    </form>
    ${p.length ? `<div class="table-wrap"><table><thead><tr><th>Data</th><th style="text-align:right">Peso</th><th style="text-align:right">Ganho/dia</th></tr></thead><tbody>
      ${p.slice().reverse().map((x,i,arr)=>{ const ant = arr[i+1]; const d = ant?diffDias(ant.data,x.data):0; const gg = ant&&d>0?(x.peso-ant.peso)/d:null; return `<tr><td>${fData(x.data)}</td><td class="n">${fNum(x.peso)} kg</td><td class="n">${gg!=null?fNum(gg*1000)+' g':'—'}</td></tr>`; }).join('')}

  }

        S.animais = S.animais.map(y => y.id===a.id ? {...y, pesagens:[...(y.pesagens||[]).filter(z=>z.data!==d), {data:d, peso:kg}]} : y);
        save(); verAnimal(a.id); render(); toast('Pesagem anotada');
      };
      const cv = $('#fVenda', f);
      if (cv) { const run = () => calcVendaRun(f, g2()); const g2 = () => gmd(S.animais.find(x=>x.id===id)); $$('input', cv).forEach(i=>i.oninput=run); run(); }
    });
}
function graficoPeso(p){
  const W=340,H=150,L=38,B=24,T=14;
  const min = Math.min(...p.map(x=>x.peso)), max = Math.max(...p.map(x=>x.peso));
  const lo = Math.floor((min-10)/10)*10, hi = Math.ceil((max+10)/10)*10;
  const d0 = p[0].data, dn = Math.max(1, diffDias(d0, p.at(-1).data));
  const X = d => L + (W-L-12) * diffDias(d0, d)/dn, Y = v => T + (H-T-B)*(1-(v-lo)/(hi-lo));
  const pts = p.map(x=>`${X(x.data)},${Y(x.peso)}`).join(' ');
  return `<div class="card"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do peso">
    ${[lo,(lo+hi)/2,hi].map(t=>`<line x1="${L}" x2="${W-6}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fNum(t)}</text>`).join('')}
    <polygon points="${X(p[0].data)},${H-B} ${pts} ${X(p.at(-1).data)},${H-B}" fill="var(--red-soft)"/>
    <polyline points="${pts}" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linejoin="round"/>
    ${p.map((x,i)=>`<circle cx="${X(x.data)}" cy="${Y(x.peso)}" r="${i===p.length-1?5:3.5}" fill="${i===p.length-1?'var(--red)':'var(--surface)'}" stroke="var(--red)" stroke-width="2"/>`).join('')}
    <text x="${L}" y="${H-6}" font-size="10" fill="var(--muted)">${fDataC(p[0].data)}</text>
    <text x="${W-6}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--muted)">${fDataC(p.at(-1).data)}</text>
  </svg><p class="small muted" style="margin:4px 0 0">Peso em kg</p></div>`;
}
function calcVenda(a, g){
  return `<section class="section"><div class="section-h"><h2>Vale a pena segurar?</h2></div>
  <form class="form card" id="fVenda" onsubmit="return false">
    <p class="small muted" style="margin:0">Compara quanto o animal engorda por dia em dinheiro com quanto custa mantê-lo.</p>
    <div class="inline">
      <div class="field"><label for="vPreco">Preço do kg vivo (R$)</label><input id="vPreco" inputmode="decimal" value="${a.precoKg||''}" placeholder="Ex.: 11,00"></div>
      <div class="field"><label for="vCusto">Custo por dia (R$)</label><input id="vCusto" inputmode="decimal" value="${a.custoDia||''}" placeholder="Ex.: 4,50"></div>
    </div>
    <div id="vRes"></div>
  </form></section>`;
}
function calcVendaRun(f, g){
  const preco = numDec($('#vPreco',f).value), custo = numDec($('#vCusto',f).value), box = $('#vRes', f);
  if (!(preco>0) || !(custo>=0) || g.ultimo==null) { box.innerHTML = `<p class="small muted" style="margin:0">Preencha os dois valores.</p>`; return; }
  const ganhoR = g.ultimo * preco, sobra = ganhoR - custo;
  box.innerHTML = `<div class="result"><span class="muted small">Engorda vale por dia</span><span class="big">${fR(ganhoR)}</span>
    <span class="pill ${sobra>=0?'good':'red'}" style="align-self:flex-start">${sobra>=0?`Sobra ${fR(sobra)} por dia: ainda compensa engordar`:`Perde ${fR(-sobra)} por dia: considere vender`}</span>
    <span class="small muted">Valor de hoje: ${fR(g.peso*preco)} (${fNum(g.peso)} kg × ${fR(preco)})</span></div>`;
}

function mesesAteChuva(){ const m = new Date().getMonth()+1; // até fevereiro

function calcForragem(){
  const ad = num($('#frAd').value)||0, jov = num($('#frJov').value)||0, peso = num($('#frPeso').value)||0, meses = numDec($('#frMeses').value)||0, pasto = Number($('#frPasto').value);

  const box = $('#frRes');
  if (!msTotal) { box.innerHTML = `<div class="card"><p class="empty">Preencha os campos acima.</p></div>`; return; }
  const sil = msTotal/0.30/1000, palma = msTotal/0.10/1000, feno = msTotal/0.85/1000, m3 = sil*1000/550;
  box.innerHTML = `<div class="result">
    <span class="muted small">Precisa de matéria seca para ${fNum(dias)} dias</span>
    <span class="big">${fNum(msTotal/1000,1)} toneladas</span>

  </tbody></table></div>

}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (ui.tab==='mais') render(); });
const instalado = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

function exportar(){
  S.ultimoBackup = hoje(); save();
  const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
  const nome = `caderno-da-roca-${hoje()}.json`;
  const file = new File([blob], nome, {type:'application/json'});
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    navigator.share({files:[file], title:'Cópia do Caderno da Roça'}).then(()=>toast('Cópia enviada')).catch(()=>baixar(blob, nome));
  } else baixar(blob, nome);
  render();
}
function baixar(blob, nome){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Cópia salva em Downloads');
}
function importar(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (!d || !Array.isArray(d.registros) || !Array.isArray(d.animais)) throw 0;
      S = Object.assign(vazio(), d, {inicioVisto:true}); save(); render(); toast(`Cópia restaurada: ${S.registros.length} anotações`);
    } catch(e) { toast('Este arquivo não é uma cópia do Caderno da Roça.'); }
  };
  fr.readAsText(file);
}

/* ---------- ligação dos botões ---------- */
function ligar(v){
  v.onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id;
    const [y,m] = ui.mes.split('-').map(Number);
    switch(act){
      case 'mesAnt': ui.mes = iso(new Date(y, m-2, 1)).slice(0,7); render(); break;
      case 'mesProx': ui.mes = iso(new Date(y, m, 1)).slice(0,7); render(); break;
      case 'irCaderno': irPara('caderno'); break;
      case 'irMais': irPara('mais'); break;
      case 'filtro': ui.filtro = b.dataset.f; render(); break;
      case 'editReg': { const r = S.registros.find(x=>x.id===id); if (r) formRegistro(r.tipo, r); break; }
      case 'novoAnimal': formAnimal(); break;
      case 'verAnimal': verAnimal(id); break;
      case 'rebF': ui.reb = b.dataset.f; render(); break;
      case 'guiaF': ui.guiaFiltro = b.dataset.f; render(); break;
      case 'abrirGuia': ui.guia = id; ui.tab='guias'; render(); window.scrollTo(0,0); if (id==='forragem'){ $$('#fForr input,#fForr select').forEach(i=>i.oninput=calcForragem); calcForragem(); } break;
      case 'voltarGuias': ui.guia = null; ui.tab='guias'; render(); window.scrollTo(0,0); break;
      case 'lembFeito': S.lembretes = S.lembretes.map(l=>l.id===id?{...l, feito:true}:l); save(); render(); toast('Lembrete concluído'); break;
      case 'lembEdit': formLembrete(S.lembretes.find(l=>l.id===id)); break;
      case 'novoLemb': formLembrete(); break;
      case 'exportar': exportar(); break;
      case 'importar': { const i = $('#arqImport'); i.onchange = () => i.files[0] && importar(i.files[0]); i.click(); break; }
      case 'instalar': if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; render(); }); } break;
      case 'salvarNome': S.nome = $('#cfgNome').value.trim(); save(); render(); toast('Nome salvo'); break;
      case 'apagarEx': apagarExemplos(); break;
      case 'verExemplo': carregarExemplo(); save(); ui.tab='inicio'; render(); break;
      case 'apagarTudo': if (b.dataset.armado) { S = vazio(); save(); ui.tab='inicio'; render(); toast('Todos os dados foram apagados'); } else { b.dataset.armado='1'; b.textContent='Toque de novo para apagar tudo. Não tem volta.'; b.classList.add('primary'); setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armado; b.textContent='Apagar todos os dados'; b.classList.remove('primary'); } }, 5000); } break;
    }
  };
  if (ui.guia==='forragem' && $('#fForr')) { $$('#fForr input,#fForr select').forEach(i=>i.oninput=calcForragem); calcForragem(); }
}
function apagarExemplos(){
  S.registros = S.registros.filter(r=>!r.ex); S.animais = S.animais.filter(a=>!a.ex); S.lembretes = S.lembretes.filter(l=>!l.ex);
  S.exemplo = false; save(); ui.mes = hoje().slice(0,7); render(); toast('Exemplos apagados. Agora é com você!');
}

let ultimoFoco = null;
function abrirFolha(titulo, html, ligarFn){

  w.onclick = e => {
    if (e.target === w) { fecharFolha(); return; }
    const r = e.target.closest('[data-act="editReg"]');
    if (r) { const reg = S.registros.find(x=>x.id===r.dataset.id); if (reg) formRegistro(reg.tipo, reg); }

function fecharFolha(){
  const w = $('#sheetWrap'); w.hidden = true; w.innerHTML = ''; document.body.style.overflow = '';

}

function carregarExemplo(){
  const h = hoje(), ex = true, R = [];
  const rnd = (seed => () => (seed = (seed*9301+49297)%233280)/233280)(7);
  const add = o => R.push(Object.assign({id:uid()+R.length, criado:R.length, ex}, o));
  // chuva do ano corrente, quadra chuvosa
  const ano = h.slice(0,4);
  const chuvas = {'01':[12,30,8],'02':[22,45,18,35,10],'03':[40,28,60,15,33,20],'04':[25,50,30,18,42],'05':[15,22,8],'06':[5]};
  Object.entries(chuvas).forEach(([m,arr]) => arr.forEach((mm,i) => { const d = `${ano}-${m}-${pad(Math.min(28, 3+i*5))}`; if (d<=h) add({tipo:'chuva', data:d, mm}); }));
  // animais
  const A = [
    {id:'exv1', nome:'Mimosa', raca:'Girolando', tipo:'leite', cobertura:addDias(h,-225), ultCio:addDias(h,-225), ultParto:addDias(h,-420), ex},
    {id:'exv2', nome:'Estrela', raca:'Girolando', tipo:'leite', ultParto:addDias(h,-70), ultCio:addDias(h,-19), ex},
    {id:'exv3', nome:'Malhada', raca:'Mestiça', tipo:'leite', cobertura:addDias(h,-262), ultCio:addDias(h,-262), ultParto:addDias(h,-400), ex},
    {id:'exv4', nome:'Fortuna', raca:'Gir', tipo:'leite', ultParto:addDias(h,-110), ex},
    {id:'exb1', nome:'Garrote 101', raca:'Nelore', tipo:'corte', pesagens:[{data:addDias(h,-120),peso:212},{data:addDias(h,-60),peso:248},{data:addDias(h,-2),peso:281}], ex},
    {id:'exb2', nome:'Garrote 102', raca:'Mestiço', tipo:'corte', pesagens:[{data:addDias(h,-120),peso:230},{data:addDias(h,-60),peso:255},{data:addDias(h,-2),peso:262}], ex},
    {id:'exb3', nome:'Garrote 103', raca:'Nelore', tipo:'corte', pesagens:[{data:addDias(h,-60),peso:198},{data:addDias(h,-2),peso:229}], ex},
  ];
  // leite diário nos últimos 75 dias
  for (let i=75; i>=0; i--) { const d = addDias(h,-i); add({tipo:'leite', data:d, litros: Math.round(34 + rnd()*8), ativ:'leite'}); }
  // gastos e vendas dos últimos 3 meses
  for (let k=0; k<3; k++) {
