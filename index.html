let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (ui.tab==='mais') render(); });
const instalado = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

function exportar(){
  S.ultimoBackup = hoje(); save();
  const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
  const nome = `caderno-da-roca-${hoje()}.json`;
  let file = null; try { file = new File([blob], nome, {type:'application/json'}); } catch(e){}
  if (file && navigator.canShare && navigator.canShare({files:[file]})) {
    navigator.share({files:[file], title:'Cópia do Caderno da Roça'}).then(()=>toast('Cópia enviada')).catch(()=>baixar(blob, nome));
  } else baixar(blob, nome);
  render();
}
function baixar(blob, nome){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Cópia salva em Downloads');
}
function importar(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (!d || !Array.isArray(d.registros) || !Array.isArray(d.animais)) throw 0;
      S = migrar(Object.assign(d, {inicioVisto:true})); save(); render(); toast(`Cópia restaurada: ${S.registros.length} anotações`);
    } catch(e) { toast('Este arquivo não é uma cópia do Caderno da Roça.'); }
  };
  fr.readAsText(file);
}
function compartilharRelatorio(p){
  const txt = textoRelatorio(p);
  if (navigator.share) { navigator.share({title:'Relatório do Caderno da Roça', text:txt}).catch(()=>{}); return; }
  const fim = () => toast('Relatório copiado. Cole no WhatsApp.');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(fim).catch(()=>abrirWhats(txt));
  else abrirWhats(txt);
}
function abrirWhats(txt){ window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank'); }

/* ---------- ligação dos botões ---------- */
function ligar(v){
  v.onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id;
    const [y,m] = ui.mes.split('-').map(Number);
    switch(act){
      case 'mesAnt': ui.mes = iso(new Date(y, m-2, 1)).slice(0,7); render(); break;
      case 'mesProx': ui.mes = iso(new Date(y, m, 1)).slice(0,7); render(); break;
      case 'balPer': ui.balPer = b.dataset.v; render(); break;
      case 'abrirProd': ui.prod = id; irPara('producao'); break;
      case 'nova': {
        const t = b.dataset.tipo, k = b.dataset.prod;
        if (t==='animal') { ui.cria = k; formAnimal(); break; }
        formRegistro(t, null, k ? {ativ:k, produto:b.dataset.produto} : {}); break; }
      case 'ouvirInicio': falar(textoInicio(), b); break;
      case 'ouvirProd': falar(textoProd(), b); break;
      case 'ouvirGuia': { const art = $('#artigo'); const c = art.cloneNode(true); $$('button', c).forEach(x=>x.remove()); falar(c.innerText, b); break; }
      case 'detAtiv': detalheAtividade(id, b.dataset.p); break;
      case 'irCaderno': irPara('caderno'); break;
      case 'irMais': irPara('mais'); break;
      case 'voltarInicio': irPara('inicio'); break;
      case 'abrirRel': ui.relPer = b.dataset.p; irPara('relatorio'); break;
      case 'relTipo': { const p = ui.relPer || ui.mes; ui.relPer = b.dataset.v==='ano' ? p.slice(0,4) : (p.length===4 ? (p===hoje().slice(0,4) ? hoje().slice(0,7) : p+'-12') : p); render(); break; }
      case 'relAnt': case 'relProx': { const p = ui.relPer || ui.mes, d = act==='relAnt' ? -1 : 1;
        ui.relPer = p.length===4 ? String(Number(p)+d) : iso(new Date(Number(p.slice(0,4)), Number(p.slice(5,7))-1+d, 1)).slice(0,7); render(); break; }
      case 'relCompartilhar': compartilharRelatorio(ui.relPer || ui.mes); break;
      case 'relImprimir': window.print(); break;
      case 'filtro': ui.filtro = b.dataset.f; render(); break;
      case 'editReg': { const r = S.registros.find(x=>x.id===id); if (r) formRegistro(r.tipo, r); break; }
      case 'novoAnimal': formAnimal(); break;
      case 'verAnimal': verAnimal(id); break;
      case 'criaF': ui.cria = b.dataset.f; render(); break;
      case 'guiaF': ui.guiaFiltro = b.dataset.f; render(); break;
      case 'abrirGuia': ui.guia = id; ui.tab='guias'; render(); window.scrollTo(0,0); break;
      case 'voltarGuias': ui.guia = null; ui.tab='guias'; render(); window.scrollTo(0,0); break;
      case 'lembFeito': S.lembretes = S.lembretes.map(l=>l.id===id?{...l, feito:true}:l); save(); render(); toast('Lembrete concluído'); break;
      case 'lembEdit': formLembrete(S.lembretes.find(l=>l.id===id)); break;
      case 'novoLemb': formLembrete(); break;
      case 'togAtiv': { const k = b.dataset.k; S.ativOcultas = S.ativOcultas.includes(k) ? S.ativOcultas.filter(x=>x!==k) : [...S.ativOcultas, k]; save(); render(); break; }
      case 'addAtiv': { const n = $('#novaAtiv').value.trim(); if (!n) { $('#novaAtiv').focus(); break; } addAtivExtra(n); save(); render(); toast(`"${n}" criado`); break; }
      case 'addAtivSug': addAtivExtra(b.dataset.n); save(); render(); toast(`"${b.dataset.n}" criado`); break;
      case 'delAtiv': {
        const a = S.ativExtra.find(x=>x.id===id), n = S.registros.filter(r=>r.ativ===id).length;
        if (n && !b.dataset.armado) { b.dataset.armado='1'; b.textContent=`Tem ${n} anotações. Toque de novo: elas vão para Casa e sítio`; b.classList.add('primary'); break; }
        S.registros = S.registros.map(r => r.ativ===id ? {...r, ativ:'geral', desc:`${r.desc||''} (${a.nome})`.trim()} : r);
        S.ativExtra = S.ativExtra.filter(x=>x.id!==id); save(); render(); toast('Removido'); break; }
      case 'exportar': exportar(); break;
      case 'importar': { const i = $('#arqImport'); i.onchange = () => i.files[0] && importar(i.files[0]); i.click(); break; }
      case 'instalar': if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; render(); }); } break;
      case 'salvarNome': S.nome = $('#cfgNome').value.trim(); save(); render(); toast('Nome salvo'); break;
      case 'apagarEx': apagarExemplos(); break;
      case 'verExemplo': carregarExemplo(); save(); ui.tab='inicio'; render(); break;
      case 'apagarTudo': if (b.dataset.armado) { S = vazio(); save(); ui.tab='inicio'; render(); toast('Todos os dados foram apagados'); } else { b.dataset.armado='1'; b.textContent='Toque de novo para apagar tudo. Não tem volta.'; b.classList.add('primary'); setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armado; b.textContent='Apagar todos os dados'; b.classList.remove('primary'); } }, 5000); } break;
    }
  };
  if (ui.guia==='forragem' && $('#fForr')) { $$('#fForr input,#fForr select').forEach(i=>i.oninput=calcForragem); calcForragem(); }
}
function apagarExemplos(){
  S.registros = S.registros.filter(r=>!r.ex); S.animais = S.animais.filter(a=>!a.ex); S.lembretes = S.lembretes.filter(l=>!l.ex);
  S.ativExtra = S.ativExtra.filter(a=>!a.ex);
  S.exemplo = false; save(); ui.mes = hoje().slice(0,7); render(); toast('Exemplos apagados. Agora é com você!');
}

/* ---------- folha ---------- */
let ultimoFoco = null;
function abrirFolha(titulo, html, ligarFn){
  const w = $('#sheetWrap');
  if (w.hidden) ultimoFoco = document.activeElement;
  w.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><div class="sheet-grab"></div><div class="sheet-h"><h2>${esc(titulo)}</h2><button class="iconbtn" data-close aria-label="Fechar">${ICONS.close}</button></div><div class="sheet-b"></div></div>`;
  $('.sheet-b', w).innerHTML = html;
  w.hidden = false; document.body.style.overflow = 'hidden';
  $('.sheet', w).scrollTop = 0;
  $('[data-close]', w).onclick = fecharFolha;
  w.onclick = e => {
    if (e.target === w) { fecharFolha(); return; }
    const r = e.target.closest('[data-act="editReg"]');
    if (r) { const reg = S.registros.find(x=>x.id===r.dataset.id); if (reg) formRegistro(reg.tipo, reg); }
  };
  ligarFn && ligarFn($('.sheet', w));
}
function fecharFolha(){
  const w = $('#sheetWrap'); w.hidden = true; w.innerHTML = ''; document.body.style.overflow = '';
  if (ultimoFoco && ultimoFoco.focus) try { ultimoFoco.focus(); } catch(e){}
}
document.addEventListener('keydown', e => { if (e.key==='Escape' && !$('#sheetWrap').hidden) fecharFolha(); });

let tt;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(()=>t.hidden=true, 2600); }
